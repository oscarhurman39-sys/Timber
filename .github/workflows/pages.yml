name: Deploy to GitHub Pages

# HOW TIMBER GETS LIVE
#
# `claude/timber-plant-pwa-j69h5e` is the live branch. Fast-forwarding it
# publishes — the push triggers this workflow on its own (verified 2026-08-10,
# run #21). One command, no dispatch, no button:
#
#   git push origin HEAD:refs/heads/claude/timber-plant-pwa-j69h5e
#
# Feature branches do NOT deploy. A push to claude/plant-card-database-oismvy on
# 2026-08-10 created no run at all even with a claude/** trigger in the pushed
# file, and a dispatch aimed at that branch died in 2s with no step logs — the
# shape of the github-pages environment refusing a non-default branch. Neither
# cause was pinned down, so this file does not encode a theory about them: it
# deploys from the live branch, which is the part that is actually established.
#
on:
  push:
    branches: [claude/timber-plant-pwa-j69h5e, main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NOT cancel-in-progress: a cancelled run can deploy and then die before the
  # served-bytes check confirms it, leaving nobody sure what is live. Two quick
  # publishes queue instead of racing.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Was two checks (build stamp + data audit). Now all six fast checks, in
      # about a second: build stamp matches content, deck/hold/csv/photos agree,
      # no card contradicts itself (plant-sense — which caught two bad cards on
      # 2026-08-10), overlay geometry has not drifted, every photo has
      # provenance, and the app's own script compiles with every special-card
      # asset present (check-boot — the gate never opens a browser, so this is
      # the only thing standing between a config typo and a blank deployed app).
      # The build stamp one matters most: it is the only way to tell
      # which version a phone is running, because the service worker serves the
      # previous build once before swapping, so a stamp that does not match its
      # content makes that single signal start lying.
      #
      # The nine browser suites are NOT here. They need Playwright and about
      # eight minutes, which is too slow in front of every deploy, so the full
      # gate stays a local pre-push step (node tests/run-all.js --jobs 3).
      - name: Fast checks (build stamp, data, sense, geometry, credits, boot safety)
        run: node tests/run-all.js --fast

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # creates the Pages site on first run — no manual settings step
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      # Verify the SERVED BYTES, not just that the deploy job went green. This
      # runs on a GitHub runner, which can reach the Pages URL, so it is real
      # end-to-end verification rather than "the workflow succeeded, so probably".
      # Pages can take a few seconds to propagate, hence the retry loop.
      - name: Verify the deployed page is this commit
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          case "$base" in */) ;; *) base="$base/" ;; esac   # page_url normally ends in / — don't rely on it
          url="${base}timber.html"
          echo "checking $url"
          for i in 1 2 3 4 5 6; do
            if node tools/build-stamp.js --verify "$url"; then
              echo "verified on attempt $i"
              exit 0
            fi
            echo "not live yet (attempt $i) — waiting 15s"
            sleep 15
          done
          echo "::error::the deployed page never matched this commit"
          exit 1
