<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  /* v11b — the painted reference IS the card. Frame, rail, panels, crest, widgets,
     emblems, labels: all reference pixels. Only plant-specific values are covered
     with matched parchment patches and re-rendered live from data. */
  *{box-sizing:border-box}
  body{margin:0;background:#0d1410;font-family:Georgia,"Times New Roman",serif;
    padding:26px;display:grid;place-items:center}
  .label{font-family:system-ui,sans-serif;font-size:12px;color:#D8BD78;font-weight:700;
    letter-spacing:1px;margin-bottom:12px;text-align:center;text-transform:uppercase}

  .tcard{width:420px;height:525px;position:relative;margin-inline:auto;
    background:url(../art/frame-full.png);background-size:100% 100%;
    border-radius:16px;box-shadow:0 18px 42px rgba(0,0,0,.6)}
  .tcard img{display:block}

  /* live photo fills the whole interior; painted panels overlay on top */
  .inner{position:absolute;left:10.52%;top:2.78%;right:2.32%;bottom:4.56%;
    overflow:hidden;border-radius:5px;z-index:1}
  .photo{position:absolute;inset:0}
  .photo img{width:100%;height:100%;object-fit:cover}
  .inner::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(20,32,16,.38) 0%,rgba(20,32,16,.10) 14%,transparent 22% 78%,rgba(15,25,12,.25) 100%)}

  .header{position:absolute;top:2%;left:3.8%;right:20%;z-index:2}
  .header h1{margin:0;font-size:21px;font-weight:700;color:#f6ecd2;line-height:1.04;
    text-shadow:0 1px 6px rgba(15,32,15,.9),0 0 18px rgba(15,32,15,.55)}
  .header .bot{font-size:10px;font-style:italic;color:#eee3bd;margin-top:3px;
    text-shadow:0 1px 5px rgba(15,32,15,.9)}
  .listen{font-family:system-ui,sans-serif;font-size:7.5px;letter-spacing:2px;font-weight:700;
    text-transform:uppercase;color:#fff;background:#0F6196;border:1px solid rgba(255,255,255,.35);
    border-radius:10px;padding:3.5px 11px;display:inline-flex;align-items:center;gap:4px;margin-top:7px;
    box-shadow:0 2px 6px rgba(0,0,0,.45)}

  /* growth-speed rail, over the photo (rebuilt: simple lines + painted leaf) */
  .growth{position:absolute;inset:0;z-index:2;pointer-events:none;
    font-family:Georgia,serif;color:#f2e8c8}
  .growth .end{position:absolute;font-size:8.5px;text-shadow:0 1px 4px rgba(0,0,0,.85)}
  .growth .axis{position:absolute;width:1.5px;background:#efe5c2;box-shadow:0 0 3px rgba(0,0,0,.7)}
  .growth .tick{position:absolute;height:1.5px;background:#efe5c2;box-shadow:0 0 3px rgba(0,0,0,.7)}
  .growth .lab{position:absolute;writing-mode:vertical-rl;transform:rotate(180deg);
    font-size:7.5px;letter-spacing:3px;color:#d8bd78;text-transform:uppercase;
    text-shadow:0 1px 4px rgba(0,0,0,.85)}
  .growth .leaf{position:absolute;width:27px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}

  /* painted overlays at their exact reference positions */
  .crest{position:absolute;left:82.44%;top:2.0%;width:15.15%;z-index:3;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))}
  .crest img{width:100%}
  .railfix{position:absolute;left:1.78%;top:22.47%;width:7.49%;height:27.46%;z-index:2}
  .railfix>img.bg{position:absolute;inset:0;width:100%;height:100%}
  .railfix .slabel{position:absolute;left:7.1%;top:12.2%;width:40.5%;height:60.3%}
  .railfix .val{position:absolute;left:45%;top:0;width:55%;height:100%;
    display:grid;place-items:center;writing-mode:vertical-rl;transform:rotate(180deg);
    font-size:12px;letter-spacing:1px;color:#ded4ae;white-space:nowrap}
  .plaque{position:absolute;left:8.11%;top:48.43%;width:71.3%;z-index:3}
  .plaque>img,.soil>img,.band>img{width:100%}
  .soil{position:absolute;left:79.68%;top:61.48%;width:17.83%;z-index:3}
  .band{position:absolute;left:9.71%;top:84.45%;width:86.72%;z-index:3}

  /* parchment cover patch: tiled swatch, soft-feathered edges */
  .patch{position:absolute;background:url(../art/parch-swatch.png);background-size:80px 40px;
    mask-image:linear-gradient(90deg,transparent,#000 7px,#000 calc(100% - 7px),transparent),
               linear-gradient(180deg,transparent,#000 6px,#000 calc(100% - 6px),transparent);
    mask-composite:intersect;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 7px,#000 calc(100% - 7px),transparent),
               linear-gradient(180deg,transparent,#000 6px,#000 calc(100% - 6px),transparent);
    -webkit-mask-composite:source-in}
  .patch.tight{
    mask-image:linear-gradient(90deg,transparent,#000 7px,#000 calc(100% - 7px),transparent),
               linear-gradient(180deg,transparent,#000 6px,#000 calc(100% - 2px),transparent);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 7px,#000 calc(100% - 7px),transparent),
               linear-gradient(180deg,transparent,#000 6px,#000 calc(100% - 2px),transparent)}
  .patch.sharpb{
    mask-image:linear-gradient(90deg,transparent,#000 7px,#000 calc(100% - 7px),transparent),
               linear-gradient(180deg,transparent,#000 6px,#000 100%);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 7px,#000 calc(100% - 7px),transparent),
               linear-gradient(180deg,transparent,#000 6px,#000 100%)}
  .val-ink{position:absolute;color:#4d4131;font-family:Georgia,serif}

  /* plaque live values (percent of plaque box; patches oversize their painted
     targets by ~8px so the mask feather still reaches full opacity over them) */
  .p-bloom-val{left:16.6%;top:12.1%;width:22.5%;height:10.3%}
  .p-pest-val{left:16.1%;top:37.8%;width:15%;height:11.1%}
  .p-thirst-val{left:16.1%;top:56.7%;width:14.4%;height:11.1%}
  .p-care-val{left:16.1%;top:74.9%;width:17.5%;height:16.6%}
  .p-bloom-w{left:41.1%;top:3.6%;width:57.8%;height:18.6%}
  .p-pest-w{left:41.6%;top:23.9%;width:57.3%;height:24.9%}
  .p-thirst-w{left:41.6%;top:50.4%;width:57.3%;height:16.6%}
  .p-care-w{left:41.6%;top:68.6%;width:57.3%;height:22.1%}
  .pval{font-size:11px;line-height:1.25;display:flex;align-items:center}
  .pval.two{flex-direction:column;align-items:flex-start;justify-content:center;gap:1px}

  .wrow{display:flex;align-items:center;justify-content:space-between;padding:0 6px;height:100%}
  .ricon{position:relative}
  .ricon>img{height:100%;width:auto}
  .ricon .fillwrap{position:absolute;left:0;top:0;height:100%;overflow:hidden;width:calc(var(--fill)*100%)}
  .ricon .fillwrap img{height:100%;width:auto;max-width:none}
  /* painted sizes: spray 85px, drop 53px, seca 98px (x 0.374 card scale) */
  #pestW .ricon{height:32px}
  #thirstW .ricon{height:20px}
  #careW .ricon{height:36px}

  .timeline{display:flex;gap:1.5px;align-items:center;justify-content:center;height:100%}
  .timeline span{font-family:Georgia,serif;font-size:7.5px;font-weight:700;width:12.5px;height:17px;
    display:grid;place-items:center;border-radius:3px;color:#8c7c48;flex:0 0 12.5px}
  .timeline span.on{background:#173B24;color:#D8BD78}

  /* soil live values (percent of soil box) */
  .s-val{left:6%;top:31.8%;width:86%;height:24.2%}
  .s-warn{left:25%;top:56.1%;width:70%;height:37.6%}
  .s-val-ink{font-size:10px;text-align:center;display:grid;place-items:center}
  .s-warn-ink{font-size:8.5px;line-height:1.3;display:flex;align-items:center}

  /* band live values (percent of band box) */
  .b-aspect{left:14.9%;top:46.2%;width:22.6%;height:35.9%}
  .b-light{left:41%;top:7.7%;width:13.4%;height:34.6%}
  .b-marker-cover{left:80.8%;top:23.1%;width:6.2%;height:23.7%}
  .b-aspect-ink{font-size:11px;display:flex;align-items:center}
  .b-light-ink{font-size:11px;display:flex;align-items:center}
  .b-tri{position:absolute;width:0;height:0;border-left:5.5px solid transparent;
    border-right:5.5px solid transparent;border-top:9px solid #1c3a26;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
</style></head>
<body>

<div>
<div class="label">V11 — the painted card itself, live data patched in</div>
<div class="tcard">

  <div class="inner">
    <div class="photo"><img src="../photos/kniphofia-pyromania-orange-blaze.jpg" style="object-position:42% 40%"></div>
    <div class="header">
      <h1>Red Hot Poker</h1>
      <div class="bot">Kniphofia 'Pyromania Orange Blaze'</div>
      <span class="listen">&#9654; Listen</span>
    </div>
    <div class="growth" id="growth"></div>
  </div>

  <div class="railfix">
    <img class="bg" src="../art/railfix.png">
    <img class="slabel" src="../art/stature-label.png">
    <span class="val">75 cm H &times; 60 cm W</span>
  </div>

  <div class="crest"><img src="../art/crest-h5.png"></div>

  <div class="plaque">
    <img src="../art/plaque-full.png">
    <div class="patch p-bloom-val"></div><div class="val-ink pval p-bloom-val">Jul&ndash;Oct</div>
    <div class="patch p-pest-val"></div><div class="val-ink pval p-pest-val">0.75/5</div>
    <div class="patch p-thirst-val"></div><div class="val-ink pval p-thirst-val">1/5</div>
    <div class="patch p-care-val"></div><div class="val-ink pval two p-care-val"><span>Easy</span><span>1.5/5</span></div>
    <div class="patch p-bloom-w"></div><div class="val-ink p-bloom-w"><div class="timeline" id="bloomTL"></div></div>
    <div class="patch p-pest-w"></div><div class="val-ink p-pest-w"><div class="wrow" id="pestW"></div></div>
    <div class="patch p-thirst-w"></div><div class="val-ink p-thirst-w"><div class="wrow" id="thirstW"></div></div>
    <div class="patch p-care-w"></div><div class="val-ink p-care-w"><div class="wrow" id="careW"></div></div>
  </div>

  <div class="soil">
    <img src="../art/soil-full.png">
    <div class="patch s-val"></div><div class="val-ink s-val s-val-ink">Free-draining</div>
    <div class="patch tight s-warn"></div><div class="val-ink s-warn s-warn-ink">Avoid winter waterlogging</div>
  </div>

  <div class="band">
    <img src="../art/band-full.png">
    <div class="patch b-aspect"></div><div class="val-ink b-aspect b-aspect-ink">Any aspect</div>
    <div class="patch tight b-light"></div><div class="val-ink b-light b-light-ink">Full sun</div>
    <div class="patch sharpb b-marker-cover"></div>
    <div class="b-tri" id="lightTri"></div>
  </div>

</div>
</div>

<script>
/* ---- data (Kniphofia 'Pyromania Orange Blaze', from plants.csv) ---- */
const D = {
  powerPest: 85, powerWater: 80, powerGrowth: 60, lightLevel: 88,
  bloomMonths: [7,8,9,10],
};

/* quarter-step geometric fills (design-system rule: clip width, never opacity) */
const getRatingSegments = (value, max = 5) =>
  Array.from({ length: max }, (_, i) => {
    const r = value - i;
    if (r >= 1) return 1;
    if (r <= 0) return 0;
    return Math.round(r * 4) / 4;
  });
const widget = (kind) => (fill) =>
  `<span class="ricon" style="--fill:${fill}">
     <img src="../art/widget-${kind}-out.png">
     <span class="fillwrap"><img src="../art/widget-${kind}-fill.png"></span></span>`;
document.getElementById('pestW').innerHTML  = getRatingSegments((100-D.powerPest)/20).map(widget('spray')).join('');
document.getElementById('thirstW').innerHTML= getRatingSegments((100-D.powerWater)/20).map(widget('drop')).join('');
document.getElementById('careW').innerHTML  = getRatingSegments(1.5).map(widget('seca')).join(''); // careLevel: demo until column exists

document.getElementById('bloomTL').innerHTML=[...'JFMAMJJASOND'].map((m,i)=>
  `<span class="${D.bloomMonths.includes(i+1)?'on':''}">${m}</span>`).join('');

/* growth rail: reference geometry — axis centreline 9px in from the inner's
   right edge, span y 92..213 (inner px). Children centred on the axis with
   right:9px + translateX(50%). */
{
  const top = 92, bot = 213;
  const fy = bot - (D.powerGrowth / 100) * (bot - top);
  let h = `<span class="end" style="right:9px;top:76px;transform:translateX(50%)">High</span>
           <span class="end" style="right:9px;top:217px;transform:translateX(50%)">Low</span>
           <div class="axis" style="right:8.25px;top:${top}px;height:${bot - top}px"></div>
           <span class="lab" style="right:17px;top:118px">Growth speed</span>`;
  for (let i = 0; i <= 4; i++) {
    const w = (i === 0 || i === 4) ? 12 : 8;
    h += `<div class="tick" style="right:${9 - w / 2}px;top:${top + (bot - top) * i / 4}px;width:${w}px"></div>`;
  }
  // leaf leans left off the axis like the reference (stem tip touches the line)
  h += `<img class="leaf" src="../art/growth-leaf.png" style="right:13px;top:${fy - 11}px;transform:translateX(50%)">`;
  document.getElementById('growth').innerHTML = h;
}

/* light marker: measured track = abs 512..1060 -> 41.42%..97.74% of the band
   crop; triangle tip sits on the track's top edge (48.1% of band height). */
{
  const tri = document.getElementById('lightTri');
  const pct = 41.42 + (D.lightLevel/100) * (97.74 - 41.42);
  tri.style.left = `calc(${pct}% - 5.5px)`;
  tri.style.top = 'calc(48.1% - 9px)';
}
</script>
</body>
</html>
