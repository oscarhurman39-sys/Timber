<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timber Command Centre</title>
  <!-- Empty data URI: stops the browser requesting /favicon.ico and logging a
       404 that would otherwise read as an application error in the console. -->
  <link rel="icon" href="data:," />

  <!-- Pinned CDN dependencies -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>

  <style>
    /* ============================================================
       01. DESIGN TOKENS AND RESET
       ============================================================ */
    :root {
      --ink: #18382d;
      --ink-soft: #52655e;
      --paper: #f3f0e6;
      --surface: #fbfaf6;
      --surface-strong: #ffffff;
      --green: #2e6a4e;
      --green-dark: #204b39;
      --green-soft: #dde8df;
      --turquoise: #3d8b83;
      --timber: #8a6543;
      --timber-soft: #d8c6af;
      --amber: #b98032;
      --amber-soft: #f3e4c8;
      --danger: #a94a45;
      --danger-soft: #f4dad7;
      --border: rgba(24, 56, 45, 0.14);
      --shadow: 0 14px 40px rgba(20, 42, 33, 0.1);
      --radius: 7px;
      --font-ui: "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(61, 139, 131, 0.07), transparent 24rem),
        linear-gradient(rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.18)),
        var(--paper);
      color: var(--ink);
      font-family: var(--font-ui);
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    :focus-visible {
      outline: 3px solid rgba(61, 139, 131, 0.45);
      outline-offset: 2px;
    }

    #root,
    .app-shell {
      min-height: 100vh;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
    }

    .container {
      width: min(100%, 1280px);
      margin-inline: auto;
      padding-inline: 1rem;
    }

    .flex {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .stack {
      display: grid;
      gap: 1rem;
    }

    .text-sm {
      font-size: 0.875rem;
    }

    .text-muted {
      color: var(--ink-soft);
    }

    .w-full {
      width: 100%;
    }

    /* ============================================================
       02. BUTTONS, BADGES AND PANELS
       ============================================================ */
    .btn {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 1rem;
      background: var(--surface-strong);
      color: var(--ink);
      font-weight: 650;
      text-decoration: none;
      transition:
        background 150ms ease,
        border-color 150ms ease,
        transform 150ms ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--paper);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-primary {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--green-dark);
    }

    .btn-danger {
      border-color: var(--danger);
      background: var(--danger);
      color: #fff;
    }

    .btn-outline {
      background: transparent;
    }

    .btn-sm {
      min-height: 34px;
      padding: 0.28rem 0.72rem;
      font-size: 0.875rem;
    }

    .badge {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 0.75rem;
      font-weight: 750;
    }

    .badge-demo {
      min-height: 44px;
      border: 1px solid var(--amber);
      background: var(--amber-soft);
      color: #765015;
    }

    .badge-danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(251, 250, 246, 0.92);
      box-shadow: var(--shadow);
    }

    /* ============================================================
       03. HEADER AND NAVIGATION
       ============================================================ */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      min-height: 66px;
    }

    .logo {
      white-space: nowrap;
      color: var(--green-dark);
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .logo span {
      color: var(--timber);
      font-weight: 650;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      gap: 0.2rem;
      min-width: 0;
    }

    .nav-link {
      min-height: 44px;
      border: 0;
      border-radius: var(--radius);
      padding: 0.42rem 0.72rem;
      background: transparent;
      color: var(--ink-soft);
      font-size: 0.875rem;
      font-weight: 650;
    }

    .nav-link:hover {
      background: var(--paper);
      color: var(--ink);
    }

    .nav-link.active {
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.45rem;
    }

    .role-selector {
      min-height: 44px;
      max-width: 180px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.35rem 0.6rem;
      background: var(--surface-strong);
      color: var(--ink);
    }

    .bottom-nav {
      display: none;
    }

    /* ============================================================
       04. MAIN VIEWS
       ============================================================ */
    .app-main {
      flex: 1;
      padding-block: 1.5rem 2rem;
    }

    .view-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .view-header h1 {
      color: var(--green-dark);
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 3vw, 2.3rem);
      line-height: 1.1;
    }

    .view-placeholder {
      display: grid;
      gap: 1rem;
      min-height: 220px;
      place-items: center;
      border: 1px dashed rgba(24, 56, 45, 0.24);
      border-radius: var(--radius);
      padding: 2rem;
      background: rgba(251, 250, 246, 0.7);
      text-align: center;
    }

    .view-placeholder h2 {
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 1.35rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      width: min(100%, 650px);
    }

    .summary-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem;
      background: var(--surface-strong);
      text-align: left;
    }

    .summary-card strong {
      display: block;
      color: var(--green-dark);
      font-size: 1.2rem;
    }

    .stub-controls {
      display: flex;
      justify-content: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .action-list {
      display: grid;
      gap: 0.55rem;
      width: min(100%, 600px);
      list-style: none;
      text-align: left;
    }

    .action-list li {
      border-bottom: 1px solid var(--border);
      padding: 0.55rem 0;
    }

    /* ============================================================
       05. STORAGE AND BOOTSTRAP NOTICES
       ============================================================ */
    .storage-warning {
      position: relative;
      z-index: 40;
      border-bottom: 1px solid rgba(169, 74, 69, 0.24);
      padding: 0.55rem 1rem;
      background: var(--danger-soft);
      color: #762f2c;
      text-align: center;
      font-size: 0.875rem;
      font-weight: 650;
    }

    /* ============================================================
       06. TOASTS
       ============================================================ */
    .toast-container {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 4000;
      display: grid;
      gap: 0.55rem;
      width: min(360px, calc(100vw - 2rem));
    }

    .toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 0.85rem;
      background: var(--surface-strong);
      box-shadow: var(--shadow);
      animation: toast-in 180ms ease-out;
    }

    .toast-close,
    .icon-button {
      display: inline-grid;
      min-width: 34px;
      min-height: 34px;
      place-items: center;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--ink-soft);
      font-size: 1.1rem;
    }

    .toast-close:hover,
    .icon-button:hover {
      background: var(--paper);
      color: var(--ink);
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================================
       07. MODAL AND DRAWER PORTALS
       ============================================================ */
    .modal-overlay,
    .drawer-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      background: rgba(15, 30, 24, 0.38);
      backdrop-filter: blur(3px);
    }

    .modal-overlay {
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .drawer-overlay {
      justify-content: flex-end;
    }

    .modal-box,
    .drawer-panel {
      border: 1px solid var(--border);
      background: var(--surface-strong);
      box-shadow: var(--shadow);
    }

    .modal-box {
      width: min(100%, 620px);
      max-height: min(90vh, 760px);
      overflow: auto;
      border-radius: var(--radius);
      padding: 1.35rem;
      animation: modal-in 180ms ease-out;
    }

    .drawer-panel {
      width: min(500px, 94vw);
      height: 100%;
      overflow: auto;
      padding: 1.35rem;
      animation: drawer-in 180ms ease-out;
    }

    .dialog-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .dialog-heading h2 {
      color: var(--green-dark);
      font-family: var(--font-serif);
      font-size: 1.35rem;
    }

    @keyframes modal-in {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes drawer-in {
      from {
        transform: translateX(100%);
      }
      to {
        transform: translateX(0);
      }
    }

    /* ============================================================
       08. DEVELOPER POPOVER
       ============================================================ */
    .dev-panel {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 500;
      display: none;
      width: min(360px, calc(100vw - 2rem));
      max-height: min(70vh, 620px);
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      background: var(--surface-strong);
      box-shadow: var(--shadow);
    }

    .dev-panel.open {
      display: block;
    }

    .dev-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.8rem;
    }

    .dev-heading h2 {
      color: var(--green-dark);
      font-family: var(--font-serif);
      font-size: 1.15rem;
    }

    .test-results {
      display: grid;
      gap: 0.25rem;
      max-height: 240px;
      margin-top: 0.75rem;
      overflow: auto;
      font-size: 0.75rem;
    }

    /* ============================================================
       09. RESPONSIVE AND ACCESSIBILITY
       ============================================================ */
    @media (max-width: 980px) {
      .header-inner {
        grid-template-columns: auto 1fr;
      }

      .nav-links {
        grid-column: 1 / -1;
        grid-row: 2;
        justify-content: flex-start;
        overflow-x: auto;
        padding-bottom: 0.35rem;
      }

      .header-actions {
        grid-column: 2;
        grid-row: 1;
      }
    }

    @media (max-width: 720px) {
      .header-inner {
        grid-template-columns: 1fr auto;
      }

      .nav-links {
        display: none;
      }

      .logo span {
        display: none;
      }

      .role-selector {
        max-width: 135px;
      }

      .bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 50;
        display: flex;
        justify-content: space-around;
        gap: 0.2rem;
        border-top: 1px solid var(--border);
        padding: 0.3rem 0.45rem max(0.3rem, env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(12px);
      }

      .bottom-nav button {
        display: grid;
        min-width: 58px;
        min-height: 48px;
        place-items: center;
        border: 0;
        border-radius: var(--radius);
        padding: 0.28rem;
        background: transparent;
        color: var(--ink-soft);
        font-size: 0.68rem;
        font-weight: 700;
      }

      .bottom-nav button.active {
        background: var(--green-soft);
        color: var(--green-dark);
      }

      .nav-icon {
        display: block;
        font-size: 1.15rem;
        line-height: 1;
      }

      .app-main {
        padding-bottom: 5rem;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .view-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .toast-container {
        bottom: 4.7rem;
      }

      .dev-panel {
        right: 0.5rem;
        bottom: 4.7rem;
        width: calc(100vw - 1rem);
      }

      .drawer-panel {
        width: 100%;
      }
    }

    @media (pointer: coarse) {
      .btn-sm,
      .toast-close,
      .icon-button {
        min-width: 44px;
        min-height: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media print {
      .app-header,
      .bottom-nav,
      .toast-container,
      .dev-panel,
      .storage-warning,
      #overlay-root {
        display: none !important;
      }

      body {
        background: #fff;
      }

      .app-main {
        padding: 0;
      }

      .match-layout,
      .view-header {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }
    }

    /* ============================================================
       10. CUSTOMER MATCH AND TODAY
       ============================================================ */
    .match-layout {
      display: grid;
      grid-template-columns: minmax(0, 20rem) minmax(0, 1fr) minmax(0, 19rem);
      align-items: start;
      gap: 1rem;
    }

    .today-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 21rem);
      align-items: start;
      gap: 1rem;
    }

    .panel {
      padding: 1rem;
    }

    .panel h2 {
      color: var(--green-dark);
      font-family: var(--font-serif);
      font-size: 1.15rem;
      margin-bottom: 0.35rem;
    }

    .panel h3 {
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }

    .summary-grid.wide {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      width: 100%;
      margin-bottom: 1rem;
    }

    /* Wizard ---------------------------------------------------- */
    .wizard {
      position: sticky;
      top: 5.2rem;
    }

    .wizard-steps {
      display: grid;
      gap: 0.15rem;
      margin-bottom: 0.9rem;
      list-style: none;
    }

    .wizard-steps button {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      width: 100%;
      min-height: 40px;
      border: 0;
      border-radius: var(--radius);
      padding: 0.3rem 0.5rem;
      background: transparent;
      color: var(--ink-soft);
      font-size: 0.85rem;
      text-align: left;
    }

    .wizard-steps button.active {
      background: var(--green-soft);
      color: var(--green-dark);
      font-weight: 700;
    }

    .step-number {
      display: grid;
      width: 22px;
      height: 22px;
      flex: none;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .wizard-body {
      padding-block: 0.35rem 0.9rem;
      border-top: 1px solid var(--border);
    }

    .wizard-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .field {
      display: grid;
      gap: 0.25rem;
    }

    .field-label {
      font-size: 0.82rem;
      font-weight: 650;
    }

    .field-hint {
      color: var(--ink-soft);
      font-size: 0.75rem;
    }

    .control {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.35rem 0.55rem;
      background: var(--surface-strong);
      color: var(--ink);
    }

    input[type="range"].control {
      padding: 0;
      background: transparent;
    }

    .control.qty {
      width: 4.5rem;
      min-height: 36px;
    }

    .strictness {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
    }

    .strictness button {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.15rem 0.7rem;
      background: var(--surface-strong);
      color: var(--ink-soft);
      font-size: 0.75rem;
      font-weight: 650;
    }

    .strictness button.active {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green-dark);
    }

    .safety-set,
    .reason-set {
      display: grid;
      gap: 0.3rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.7rem;
    }

    .safety-set legend,
    .reason-set legend {
      padding-inline: 0.3rem;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 34px;
      cursor: pointer;
    }

    .check-row input {
      width: 18px;
      height: 18px;
      flex: none;
    }

    /* Results --------------------------------------------------- */
    .results-empty,
    .results-summary {
      padding: 1rem;
    }

    .result-group {
      display: grid;
      gap: 0.6rem;
      margin-top: 0.4rem;
    }

    .result-group > h2 {
      color: var(--green-dark);
      font-family: var(--font-serif);
      font-size: 1.05rem;
    }

    .result-card {
      display: grid;
      gap: 0.55rem;
      border: 1px solid var(--border);
      border-left: 4px solid var(--green);
      border-radius: var(--radius);
      padding: 0.9rem;
      background: var(--surface-strong);
      box-shadow: var(--shadow);
    }

    .result-card.verify {
      border-left-color: var(--amber);
    }

    .result-card.unavailable {
      border-left-color: var(--ink-soft);
      background: rgba(243, 240, 230, 0.65);
      box-shadow: none;
    }

    .result-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .result-title h3 {
      color: var(--green-dark);
      font-family: var(--font-serif);
      font-size: 1.08rem;
      line-height: 1.25;
    }

    .result-score {
      display: grid;
      flex: none;
      justify-items: end;
      gap: 0.15rem;
      text-align: right;
    }

    .score-chip {
      display: inline-grid;
      min-width: 3.2rem;
      place-items: center;
      border-radius: var(--radius);
      padding: 0.2rem 0.5rem;
      background: var(--green);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .result-facts {
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
      font-size: 0.82rem;
    }

    .badge-row {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .badge-warn {
      background: var(--amber-soft);
      color: #765015;
    }

    .reason-list {
      display: grid;
      gap: 0.18rem;
      font-size: 0.85rem;
      list-style: none;
    }

    .reason-list.compromises {
      color: var(--ink-soft);
    }

    .pos {
      display: inline-block;
      min-width: 2.1rem;
      color: var(--green-dark);
      font-weight: 800;
    }

    .neg {
      display: inline-block;
      min-width: 2.1rem;
      color: var(--danger);
      font-weight: 800;
    }

    .unavailable-reason,
    .rejected-note {
      border-radius: var(--radius);
      padding: 0.35rem 0.5rem;
      background: var(--danger-soft);
      color: #762f2c;
      font-size: 0.82rem;
      font-weight: 650;
    }

    .result-actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    /* Shortlist ------------------------------------------------- */
    .shortlist {
      position: sticky;
      top: 5.2rem;
      display: grid;
      gap: 0.7rem;
    }

    .shortlist-line {
      display: grid;
      gap: 0.4rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.6rem;
      background: var(--paper);
    }

    .addons {
      display: grid;
      gap: 0.1rem;
    }

    .totals {
      display: grid;
      gap: 0.25rem;
      border-top: 1px solid var(--border);
      padding-top: 0.6rem;
      font-size: 0.88rem;
    }

    .total-line {
      border-top: 1px solid var(--border);
      padding-top: 0.35rem;
      font-size: 1rem;
    }

    .warn-line {
      color: #762f2c;
    }

    /* Callouts and score table ---------------------------------- */
    .callout {
      border-left: 3px solid var(--turquoise);
      border-radius: var(--radius);
      padding: 0.6rem 0.75rem;
      background: rgba(61, 139, 131, 0.08);
      font-size: 0.85rem;
    }

    .callout ul {
      margin: 0.25rem 0 0 1rem;
    }

    .callout-warn {
      border-left-color: var(--amber);
      background: var(--amber-soft);
    }

    .callout-danger {
      border-left-color: var(--danger);
      background: var(--danger-soft);
    }

    .table-scroll {
      overflow-x: auto;
    }

    .score-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .score-table caption {
      margin-bottom: 0.35rem;
      text-align: left;
    }

    .score-table th,
    .score-table td {
      border-bottom: 1px solid var(--border);
      padding: 0.35rem 0.4rem;
      text-align: left;
      vertical-align: top;
    }

    .score-table thead th {
      color: var(--ink-soft);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .score-table .num {
      text-align: right;
      white-space: nowrap;
    }

    .req-flag {
      display: block;
      color: var(--danger);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .qr {
      display: grid;
      width: 132px;
      grid-template-columns: repeat(11, 12px);
      border: 1px solid var(--border);
      padding: 6px;
      background: #fff;
    }

    .qr span {
      width: 12px;
      height: 12px;
    }

    .qr span.on {
      background: var(--ink);
    }

    /* Today ----------------------------------------------------- */
    .queue {
      display: grid;
      gap: 0.5rem;
      margin-top: 0.6rem;
      list-style: none;
    }

    .queue-item {
      display: grid;
      gap: 0.4rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.65rem;
      background: var(--surface-strong);
    }

    .queue-head {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
    }

    .queue-head h3 {
      font-size: 0.95rem;
      line-height: 1.3;
    }

    .queue-head > div {
      flex: 1;
      min-width: 0;
    }

    .urgency-dot {
      width: 10px;
      height: 10px;
      flex: none;
      margin-top: 0.35rem;
      border-radius: 999px;
      background: var(--ink-soft);
    }

    .urgency-dot.urgency-high {
      background: var(--danger);
    }

    .urgency-dot.urgency-medium {
      background: var(--amber);
    }

    .queue-type {
      flex: none;
      background: var(--timber-soft);
      color: #5c4028;
      font-size: 0.68rem;
    }

    .queue-meta {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .queue-actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .demand-list {
      display: grid;
      gap: 0.4rem;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      list-style: none;
    }

    .demand-list li {
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.35rem;
    }

    .print-only {
      display: none;
    }

    @media (max-width: 1180px) {
      .match-layout {
        grid-template-columns: minmax(0, 18rem) minmax(0, 1fr);
      }

      .shortlist {
        position: static;
        grid-column: 1 / -1;
      }

      .summary-grid.wide {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .match-layout,
      .today-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .wizard {
        position: static;
      }
    }

    @media (max-width: 560px) {
      /* The header actions overflowed the viewport at 360px and 390px in the
         Phase 1 foundation. Give them their own row rather than dropping a
         control. */
      .header-inner {
        grid-template-columns: minmax(0, 1fr);
        padding-block: 0.4rem;
      }

      .header-actions {
        grid-column: 1;
        grid-row: 2;
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      .role-selector {
        max-width: 100%;
      }

      .summary-grid.wide {
        grid-template-columns: minmax(0, 1fr);
      }

      .result-head {
        flex-direction: column;
      }

      .result-score {
        justify-items: start;
        text-align: left;
      }
    }

    /* ============================================================
       11. NON-JS FALLBACK
       ============================================================ */
    .fallback-shell {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 1rem;
    }

    .fallback {
      width: min(100%, 620px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      background: var(--surface);
      text-align: center;
    }

    .fallback h1 {
      margin-bottom: 0.65rem;
      color: var(--green-dark);
      font-family: var(--font-serif);
    }
  </style>
</head>

    function cloneJson(value) {
