    // ============================================================
    // 03. PERSISTENCE AND MIGRATION
    // ============================================================
    function isPlainObject(value) {
      return (
        value !== null &&
        typeof value === "object" &&
        !Array.isArray(value)
      );
    }

    const PERSISTENT_ARRAY_FIELDS = [
      "plants",
      "staff",
      "sites",
      "matchSessions",
      "learningAssignments",
      "quizAttempts",
      "curatorItems",
      "demandSignals",
      "actionItems",
      "activityEvents"
    ];

    const CRITICAL_ARRAY_FIELDS = [
      "plants",
      "staff",
      "sites",
      "matchSessions",
      "actionItems",
      "activityEvents"
    ];

    function buildPersistentSignaturePayload(state) {
      return {
        meta: {
          schemaVersion: SCHEMA_VERSION,
          demoData: state.meta.demoData,
          activeSiteId: state.meta.activeSiteId,
          activeRole: state.meta.activeRole,
          activeUserId: state.meta.activeUserId
        },

        plants: state.plants,
        staff: state.staff,
        sites: state.sites,
        matchSessions: state.matchSessions,
        learningAssignments: state.learningAssignments,
        quizAttempts: state.quizAttempts,
        curatorItems: state.curatorItems,
        demandSignals: state.demandSignals,
        actionItems: state.actionItems,
        activityEvents: state.activityEvents,
        valueProof: state.valueProof
      };
    }

    function buildPersistentPayload(state, savedAt = new Date().toISOString()) {
      const payload = buildPersistentSignaturePayload(state);

      return {
        ...payload,
        meta: {
          ...payload.meta,
          lastSavedAt: savedAt
        }
      };
    }

    function createMemoryStorage(initialValues = {}) {
      const entries = new Map(Object.entries(initialValues));

      return {
        getItem(key) {
          return entries.has(key) ? entries.get(key) : null;
        },
        setItem(key, value) {
          entries.set(key, String(value));
        },
        removeItem(key) {
          entries.delete(key);
        },
        clear() {
          entries.clear();
        },
        snapshot() {
          return Object.fromEntries(entries);
        }
      };
    }

    function writePersistentPayload(storage, key, payload) {
      storage.setItem(key, JSON.stringify(payload));
      return payload.meta.lastSavedAt;
    }

    function saveState(
      state,
      storage = window.localStorage,
      key = STORAGE_KEY
    ) {
      const payload = buildPersistentPayload(state);
      return writePersistentPayload(storage, key, payload);
    }

    function migrationFailure(message) {
      return {
        ok: false,
        notice:
          message ||
          "Saved demo data was invalid. Fresh demo data has been loaded."
      };
    }

    function migrateSavedState(saved) {
      if (!isPlainObject(saved)) {
        return migrationFailure();
      }

      if (saved.meta !== undefined && !isPlainObject(saved.meta)) {
        return migrationFailure();
      }

      const input = cloneJson(saved);
      const rawVersion = input.meta?.schemaVersion ?? 0;
      const version = Number(rawVersion);

      if (!Number.isInteger(version) || version < 0) {
        return migrationFailure();
      }

      if (version > SCHEMA_VERSION) {
        throw new Error(
          "Saved Timber data uses a newer unsupported schema."
        );
      }

      const seedPersistent = buildPersistentSignaturePayload(cloneSeed());

      if (version === 0) {
        const migrated = {
          ...seedPersistent,
          ...input,
          meta: {
            ...seedPersistent.meta,
            ...(input.meta || {}),
            schemaVersion: SCHEMA_VERSION,
            lastSavedAt: input.meta?.lastSavedAt || null
          }
        };

        for (const key of PERSISTENT_ARRAY_FIELDS) {
          if (input[key] === undefined) {
            migrated[key] = cloneJson(seedPersistent[key]);
          } else if (!Array.isArray(input[key])) {
            return migrationFailure();
          } else {
            migrated[key] = input[key];
          }
        }

        if (input.valueProof === undefined) {
          migrated.valueProof = cloneJson(seedPersistent.valueProof);
        } else if (!isPlainObject(input.valueProof)) {
          return migrationFailure();
        }

        return {
          ok: true,
          state: migrated,
          migratedFrom: 0
        };
      }

      for (const key of CRITICAL_ARRAY_FIELDS) {
        if (!Array.isArray(input[key])) {
          return migrationFailure();
        }
      }

      for (const key of PERSISTENT_ARRAY_FIELDS) {
        if (!Array.isArray(input[key])) {
          return migrationFailure();
        }
      }

      if (!isPlainObject(input.valueProof)) {
        return migrationFailure();
      }

      return {
        ok: true,
        state: {
          ...input,
          meta: {
            ...(input.meta || {}),
            schemaVersion: SCHEMA_VERSION,
            lastSavedAt: input.meta?.lastSavedAt || null
          }
        },
        migratedFrom: SCHEMA_VERSION
      };
    }

    function hydratePersistentState(saved) {
      const seed = cloneSeed();
      const migration = migrateSavedState(saved);

      if (!migration.ok) {
        return {
          state: seed,
          notice: migration.notice
        };
      }

      const migrated = migration.state;
      const storedRole = ROLES.includes(migrated.meta?.activeRole)
        ? migrated.meta.activeRole
        : seed.meta.activeRole;

      seed.meta = {
        ...seed.meta,
        schemaVersion: SCHEMA_VERSION,
        demoData:
          typeof migrated.meta?.demoData === "boolean"
            ? migrated.meta.demoData
            : true,
        activeSiteId:
          migrated.meta?.activeSiteId || seed.meta.activeSiteId,
        activeRole: storedRole,
        activeUserId: ROLE_USERS[storedRole],
        lastSavedAt: migrated.meta?.lastSavedAt || null
      };

      for (const key of PERSISTENT_ARRAY_FIELDS) {
        seed[key] = cloneJson(migrated[key]);
      }

      seed.valueProof = cloneJson(migrated.valueProof);

      seed.ui = {
        ...cloneJson(DEMO_STATE.ui),
        activeView: ROLE_DEFAULT_VIEW[storedRole]
      };

      seed.matchDraft = cloneJson(DEMO_STATE.matchDraft);
      seed.matchRun = null;
      seed.matchShortlist = [];
      seed.matchRejections = {};
      seed.matchConfirmation = null;

      return {
        state: seed,
        notice: null
      };
    }

    function loadStateFromStorage(
      storage = window.localStorage,
      key = STORAGE_KEY,
      logger = console
    ) {
      try {
        const raw = storage.getItem(key);

        if (raw === null) {
          return {
            state: null,
            notice: null
          };
        }

        const parsed = JSON.parse(raw);
        return hydratePersistentState(parsed);
      } catch (error) {
        logger.warn("Timber: failed to restore saved demo state.", error);

        return {
          state: cloneSeed(),
          notice:
            "Saved demo data could not be restored. Fresh demo data has been loaded."
        };
      }
    }

    // ============================================================
    // 04. MATCH SCORING ENGINE
    //
    // Pure functions only. No React, no application state, no Date and no
    // randomness — identical input must always produce identical ranking,
    // and a self-test asserts exactly that.
    //
    // Light model: the customer describes the POSITION. `light.preferred` is
    // the light the spot normally receives; `light.minimum` is the lowest it
    // drops to. A plant must cope with the worst case (its sunMin must not
    // exceed the position's low), and is then scored on how well the normal
    // level suits its preference.
    // ============================================================
    function clamp01(value) {
      return Math.max(0, Math.min(1, value));
    }

    function isNumber(value) {
      return typeof value === "number" && Number.isFinite(value);
    }

    function monthInRange(month, startMonth, endMonth) {
      return startMonth <= endMonth
        ? month >= startMonth && month <= endMonth
        : month >= startMonth || month <= endMonth;
    }

    function seasonOverlapFraction(seasonKey, peakInterest) {
      const months = SEASON_MONTHS[seasonKey];

      if (!months) {
        return null;
      }

      const hits = months.filter((month) =>
        monthInRange(month, peakInterest.startMonth, peakInterest.endMonth)
      ).length;

      return hits / months.length;
    }

    function stockAtSite(plant, siteId) {
      const location = plant.commercial.locations.find(
        (entry) => entry.siteId === siteId
      );

      return location ? location.quantity : plant.commercial.stockQty;
    }

    function benchAtSite(plant, siteId) {
      const location = plant.commercial.locations.find(
        (entry) => entry.siteId === siteId
      );

      return location ? location.bench : "Not located";
    }

    const SAFETY_PARTIES = [
      { key: "cats", toxicityKey: "cats", label: "cats" },
      { key: "dogs", toxicityKey: "dogs", label: "dogs" },
      { key: "children", toxicityKey: "humans", label: "children" }
    ];

    function requiredSafetyParties(requirements) {
      return SAFETY_PARTIES.filter(
        (party) => requirements.safety[party.key] === "required"
      );
    }

    /* Each scorer returns null when the customer expressed no preference,
       otherwise { fraction, requirement, plantValue, note }. */
    const CRITERION_SCORERS = {
      light(plant, req) {
        const preferred = req.light.preferred;

        if (!isNumber(preferred)) {
          return null;
        }

        const worstCase = isNumber(req.light.minimum)
          ? Math.min(req.light.minimum, preferred)
          : preferred;

        const { sunNeed, sunMin } = plant.siteRequirements;
        const requirementLabel = isNumber(req.light.minimum)
          ? `${preferred}/100, dropping to ${req.light.minimum}`
          : `${preferred}/100`;

        const plantValue = `tolerates ${sunMin}, prefers ${sunNeed}`;

        if (sunMin > worstCase) {
          return {
            fraction: 0,
            requirement: requirementLabel,
            plantValue,
            note: `Needs more light than this position gives (tolerates down to ${sunMin}, position falls to ${worstCase})`
          };
        }

        if (preferred > sunNeed + 20) {
          const excess = preferred - sunNeed - 20;

          return {
            fraction: clamp01(1 - excess / 60),
            requirement: requirementLabel,
            plantValue,
            note: `Brighter than it prefers — expect scorch on the exposed side`
          };
        }

        if (preferred >= sunNeed) {
          return {
            fraction: 1,
            requirement: requirementLabel,
            plantValue,
            note: "Position gives the light it prefers"
          };
        }

        const span = sunNeed - sunMin;
        const within = span > 0 ? clamp01((preferred - sunMin) / span) : 1;

        return {
          fraction: 0.4 + 0.6 * within,
          requirement: requirementLabel,
          plantValue,
          note:
            within >= 0.75
              ? "Comfortably inside its light range"
              : "Within tolerance but shadier than ideal — expect less flower"
        };
      },

      aspect(plant, req) {
        if (!req.aspect.value) {
          return null;
        }

        const suits = plant.siteRequirements.aspects.includes(req.aspect.value);

        return {
          fraction: suits ? 1 : 0.3,
          requirement: ASPECT_LABELS[req.aspect.value],
          plantValue: plant.siteRequirements.aspects
            .map((aspect) => ASPECT_LABELS[aspect])
            .join(", "),
          note: suits
            ? "Suits this facing"
            : "Not a facing it is usually recommended for"
        };
      },

      soil(plant, req) {
        if (!req.soil.value) {
          return null;
        }

        const suits = plant.siteRequirements.soils.includes(req.soil.value);
        const broad = plant.siteRequirements.soils.length >= 4;

        return {
          fraction: suits ? 1 : broad ? 0.5 : 0.15,
          requirement: req.soil.value,
          plantValue: plant.siteRequirements.soils.join(", "),
          note: suits
            ? "Grows on this soil"
            : `Prefers ${plant.siteRequirements.soils.join(" or ")}`
        };
      },

      moisture(plant, req) {
        if (!req.moisture.value) {
          return null;
        }

        const wanted = MOISTURE_LEVELS.indexOf(req.moisture.value);

        const distances = plant.siteRequirements.moisture.map((level) =>
          Math.abs(MOISTURE_LEVELS.indexOf(level) - wanted)
        );

        const nearest = Math.min(...distances);
        const fraction = nearest === 0 ? 1 : nearest === 1 ? 0.55 : 0.1;

        return {
          fraction,
          requirement: req.moisture.value,
          plantValue: plant.siteRequirements.moisture.join(", "),
          note:
            nearest === 0
              ? "Matches the moisture described"
              : nearest === 1
                ? "Slightly different moisture than described"
                : "Wants noticeably different moisture"
        };
      },

      height(plant, req) {
        if (!isNumber(req.height.maximumM)) {
          return null;
        }

        const maximum = req.height.maximumM;
        const actual = plant.dimensions.ultimateHeightM;
        const over = actual - maximum;

        return {
          fraction:
            over <= 0 ? 1 : clamp01(1 - over / Math.max(maximum, 0.5)) * 0.8,
          requirement: `up to ${maximum}m`,
          plantValue: `${actual}m ultimate`,
          note:
            over <= 0
              ? "Stays within the height asked for"
              : `Grows about ${over.toFixed(1)}m taller than asked`
        };
      },

      spread(plant, req) {
        if (!isNumber(req.spread.maximumM)) {
          return null;
        }

        const maximum = req.spread.maximumM;
        const actual = plant.dimensions.ultimateSpreadM;
        const over = actual - maximum;

        return {
          fraction:
            over <= 0 ? 1 : clamp01(1 - over / Math.max(maximum, 0.5)) * 0.8,
          requirement: `up to ${maximum}m`,
          plantValue: `${actual}m ultimate`,
          note:
            over <= 0
              ? "Stays within the width asked for"
              : `Spreads about ${over.toFixed(1)}m wider than asked`
        };
      },

      evergreen(plant, req) {
        if (req.evergreen.value === null || req.evergreen.value === undefined) {
          return null;
        }

        const foliage = plant.appearance.foliage;

        if (req.evergreen.value === true) {
          const fraction =
            foliage === "evergreen" ? 1 : foliage === "semi-evergreen" ? 0.55 : 0;

          return {
            fraction,
            requirement: "evergreen",
            plantValue: foliage,
            note:
              foliage === "evergreen"
                ? "Evergreen, as asked"
                : foliage === "semi-evergreen"
                  ? "Semi-evergreen — thins in a hard winter"
                  : "Loses its leaves in winter"
          };
        }

        return {
          fraction: foliage === "evergreen" ? 0.6 : 1,
          requirement: "deciduous accepted",
          plantValue: foliage,
          note: "Foliage type accepted"
        };
      },

      season(plant, req) {
        if (!req.season.value) {
          return null;
        }

        const overlap = seasonOverlapFraction(
          req.season.value,
          plant.appearance.peakInterest
        );

        return {
          fraction: overlap === null ? 0 : overlap,
          requirement: SEASON_LABELS[req.season.value],
          plantValue: plant.appearance.peakInterest.label,
          note:
            overlap === 1
              ? `Interest right through ${SEASON_LABELS[req.season.value].toLowerCase()}`
              : overlap > 0
                ? "Overlaps part of the season asked for"
                : "Peak interest falls outside that season"
        };
      },

      container(plant, req) {
        if (!req.container.required) {
          return null;
        }

        const suitability = plant.suitability.container;

        return {
          fraction: CONTAINER_SCORE[suitability] ?? 0,
          requirement: "must grow in a container",
          plantValue: suitability,
          note:
            suitability === "unsuitable"
              ? "Not a container plant"
              : suitability === "suitable-when-young"
                ? "Fine in a pot while young, then needs the ground"
                : "Grows in a container"
        };
      },

      maintenance(plant, req) {
        if (!isNumber(req.maintenance.maximum)) {
          return null;
        }

        const maximum = req.maintenance.maximum;
        const actual = plant.suitability.maintenance;
        const over = actual - maximum;

        return {
          fraction: over <= 0 ? 1 : clamp01(1 - over / 10),
          requirement: `up to ${maximum}/20`,
          plantValue: `${actual}/20`,
          note:
            over <= 0
              ? "Within the upkeep the customer accepts"
              : "Needs more attention than the customer wants to give"
        };
      },

      drought(plant, req) {
        if (!isNumber(req.drought.minimum)) {
          return null;
        }

        const minimum = req.drought.minimum;
        const actual = plant.suitability.droughtTolerance;
        const under = minimum - actual;

        return {
          fraction: under <= 0 ? 1 : clamp01(1 - under / 10),
          requirement: `at least ${minimum}/20`,
          plantValue: `${actual}/20`,
          note:
            under <= 0
              ? "Copes with dry spells as asked"
              : "Will need watering through a dry summer"
        };
      },

      safety(plant, req) {
        const parties = requiredSafetyParties(req);

        if (parties.length === 0) {
          return null;
        }

        const toxicity = plant.safety.toxicity;
        let total = 0;
        const notes = [];

        for (const party of parties) {
          const value = toxicity[party.toxicityKey];

          if (value === "not-known-toxic") {
            total += 1;
            notes.push(`no known toxicity to ${party.label}`);
          } else if (value === "unknown") {
            // Half credit, not zero: unverified is worse than safe but is not
            // the same as toxic. The plant is held back for checking by the
            // verification bucket, and its score is capped separately.
            total += 0.5;
            notes.push(`toxicity to ${party.label} is unverified`);
          } else {
            notes.push(`toxic to ${party.label}`);
          }
        }

        return {
          fraction: total / parties.length,
          requirement: parties.map((party) => `safe for ${party.label}`).join(", "),
          plantValue: parties
            .map((party) => `${party.label}: ${toxicity[party.toxicityKey]}`)
            .join(", "),
          note: notes.join("; ")
        };
      },

      budget(plant, req) {
        if (!isNumber(req.budget.amountGBP)) {
          return null;
        }

        const budget = req.budget.amountGBP;
        const price = plant.commercial.priceGBP;
        const over = price - budget;

        if (over <= 0) {
          return {
            fraction: 1,
            requirement: `up to ${GBP.format(budget)} per plant`,
            plantValue: GBP.format(price),
            note: "Within budget"
          };
        }

        const ratio = over / budget;

        return {
          fraction: ratio <= 0.1 ? 0.7 : ratio <= 0.25 ? 0.4 : 0.1,
          requirement: `up to ${GBP.format(budget)} per plant`,
          plantValue: GBP.format(price),
          note: `${GBP.format(over)} over the preferred budget`
        };
      },

      availability(plant, req, context) {
        const stock = stockAtSite(plant, context.siteId);

        if (stock <= 0) {
          return null;
        }

        const bench = benchAtSite(plant, context.siteId);

        // The note must read the same way its score does — a deduction that
        // sounds like good news is worse than no note at all.
        if (stock < req.quantity) {
          return {
            fraction: 0.4,
            requirement: `${req.quantity} wanted`,
            plantValue: `${stock} in stock`,
            note: `Only ${stock} left at ${bench} — fewer than the ${req.quantity} asked for`
          };
        }

        if (stock >= 5) {
          return {
            fraction: 1,
            requirement: `${req.quantity} wanted`,
            plantValue: `${stock} in stock`,
            note: `${stock} on the bench at ${bench}`
          };
        }

        return {
          fraction: stock >= 3 ? 0.7 : 0.4,
          requirement: `${req.quantity} wanted`,
          plantValue: `${stock} in stock`,
          note: `Only ${stock} left at ${bench} — no depth if the customer wants more`
        };
      }
    };

    const CRITERION_KEYS = Object.keys(MATCH_WEIGHTS);

    function strictnessFor(requirements, key) {
      switch (key) {
        case "light": return requirements.light.strictness;
        case "aspect": return requirements.aspect.strictness;
        case "soil": return requirements.soil.strictness;
        case "moisture": return requirements.moisture.strictness;
        case "height": return requirements.height.strictness;
        case "spread": return requirements.spread.strictness;
        case "evergreen": return requirements.evergreen.strictness;
        case "season": return requirements.season.strictness;
        case "container": return requirements.container.strictness;
        case "maintenance": return requirements.maintenance.strictness;
        case "drought": return requirements.drought.strictness;
        case "budget": return requirements.budget.strictness;
        case "safety": return "required";
        default: return "preferred";
      }
    }

    function tierFor(score) {
      return TIERS.find((tier) => score >= tier.min).label;
    }

    /* Returns the §9.5 result shape for one plant. Never throws on odd data —
       a criterion that cannot be evaluated is simply not applicable. */
    function scorePlant(plant, requirements, context) {
      const rows = [];
      const blockers = [];
      const unknowns = [];

      let awarded = 0;
      let weightTotal = 0;

      for (const key of CRITERION_KEYS) {
        const outcome = CRITERION_SCORERS[key](plant, requirements, context);

        if (outcome === null) {
          continue;
        }

        const weight = MATCH_WEIGHTS[key];
        const fraction = clamp01(outcome.fraction);
        const strictness = strictnessFor(requirements, key);

        if (strictness === "neutral") {
          continue;
        }

        weightTotal += weight;
        awarded += weight * fraction;

        rows.push({
          criterion: key,
          label: CRITERION_LABELS[key],
          requirement: outcome.requirement,
          plantValue: outcome.plantValue,
          weight,
          awarded: Math.round(weight * fraction * 10) / 10,
          fraction,
          note: outcome.note,
          strictness
        });

        // Safety is excluded here on purpose — it is blocked by the explicit
        // pass below, which can tell "toxic" (block) from "unverified" (hold
        // for checking). The generic rule cannot make that distinction.
        if (strictness === "required" && fraction === 0 && key !== "safety") {
          blockers.push({
            criterion: key,
            label: `Blocked: ${outcome.note}`
          });
        }
      }

      // Unverified safety under a strict safety requirement is never treated
      // as safe — it becomes an unknown and moves the plant to verification.
      for (const party of requiredSafetyParties(requirements)) {
        const value = plant.safety.toxicity[party.toxicityKey];

        if (value === "toxic") {
          blockers.push({
            criterion: "safety",
            label: `Blocked: toxic to ${party.label}`
          });
        } else if (value === "unknown") {
          unknowns.push({
            criterion: "safety",
            label: `Toxicity to ${party.label} is not verified — do not present as safe`
          });
        }
      }

      for (const item of plant.intelligence.uncertainty) {
        unknowns.push({ criterion: "research", label: item });
      }

      let score = weightTotal > 0 ? Math.round((awarded / weightTotal) * 100) : 0;

      // §9.6 — no perfect score while meaningful uncertainty remains.
      if (plant.intelligence.uncertainty.length > 0 || plant.intelligence.confidence < 90) {
        score = Math.min(score, 95);
      }

      if (unknowns.some((entry) => entry.criterion === "safety")) {
        score = Math.min(score, 88);
      }

      const reasons = rows
        .filter((row) => row.fraction >= 0.75)
        .map((row) => ({
          criterion: row.criterion,
          delta: Math.round(row.awarded),
          tone: "positive",
          label: row.note
        }))
        .sort((a, b) => b.delta - a.delta);

      const compromises = rows
        .filter((row) => row.fraction < 0.75)
        .map((row) => ({
          criterion: row.criterion,
          delta: -Math.round(row.weight - row.awarded),
          label: row.note
        }))
        .sort((a, b) => a.delta - b.delta);

      return {
        plantId: plant.id,
        eligible: blockers.length === 0,
        score,
        confidence: plant.intelligence.confidence,
        tier: tierFor(score),
        blockers,
        reasons,
        compromises,
        unknowns,
        rows,
        substituteIds: plant.merchandising.substitutePlantIds,
        debug: {
          weightTotal,
          awarded: Math.round(awarded * 10) / 10
        }
      };
    }

    function rankResults(results) {
      return results.slice().sort((a, b) => {
        if (b.score !== a.score) {
          return b.score - a.score;
        }

        return a.plantId < b.plantId ? -1 : a.plantId > b.plantId ? 1 : 0;
      });
    }

    /* Splits the catalogue into the three panels the shop floor actually
       needs: what can be sold today, what must be verified first, and what
       cannot be sold — each with the reason attached. */
    function runMatch(plants, requirements, context) {
      const eligible = [];
      const verification = [];
      const unavailable = [];

      for (const plant of plants) {
        const result = scorePlant(plant, requirements, context);
        const stock = stockAtSite(plant, context.siteId);
        const compliance = plant.safety.compliance.status;

        if (plant.status !== "published") {
          unavailable.push({ ...result, unavailableReason: "not-published", reasonLabel: "Not published to the catalogue" });
          continue;
        }

        if (compliance === "hold") {
          unavailable.push({ ...result, unavailableReason: "compliance-hold", reasonLabel: plant.safety.compliance.warnings[0] || "Compliance hold" });
          continue;
        }

        if (result.blockers.length > 0) {
          unavailable.push({ ...result, unavailableReason: "blocked", reasonLabel: result.blockers[0].label });
          continue;
        }

        if (stock <= 0) {
          unavailable.push({ ...result, unavailableReason: "out-of-stock", reasonLabel: "Not currently available — demand opportunity" });
          continue;
        }

        if (result.unknowns.some((entry) => entry.criterion === "safety")) {
          verification.push(result);
          continue;
        }

        eligible.push(result);
      }

      return {
        eligible: rankResults(eligible),
        verification: rankResults(verification),
        unavailable: rankResults(unavailable),
        weightTotalMax: Object.values(MATCH_WEIGHTS).reduce((sum, w) => sum + w, 0)
      };
    }

    function summariseRequirements(req) {
      const parts = [];

      if (req.evergreen.value === true) parts.push("evergreen");
      if (req.evergreen.value === false) parts.push("deciduous accepted");
      if (isNumber(req.light.preferred)) parts.push(`light ${req.light.preferred}/100`);
      if (req.aspect.value) parts.push(ASPECT_LABELS[req.aspect.value].toLowerCase());
      if (req.soil.value) parts.push(`${req.soil.value} soil`);
      if (req.moisture.value) parts.push(req.moisture.value);
      if (isNumber(req.height.maximumM)) parts.push(`under ${req.height.maximumM}m tall`);
      if (isNumber(req.spread.maximumM)) parts.push(`under ${req.spread.maximumM}m wide`);
      if (req.season.value) parts.push(`${SEASON_LABELS[req.season.value].toLowerCase()} interest`);
      if (req.container.required) parts.push("for a container");

      for (const party of requiredSafetyParties(req)) {
        parts.push(`safe for ${party.label}`);
      }

      if (isNumber(req.budget.amountGBP)) parts.push(`up to ${GBP.format(req.budget.amountGBP)}`);

      return parts.length > 0 ? parts.join(", ") : "No requirements stated";
    }

    // ============================================================
    // 05. REDUCER
    // ============================================================
    function reducer(state, action) {
      switch (action.type) {
        case "SET_ROLE": {
          const nextRole = ROLES.includes(action.payload)
            ? action.payload
            : state.meta.activeRole;

          return {
            ...state,
            meta: {
              ...state.meta,
              activeRole: nextRole,
              activeUserId: ROLE_USERS[nextRole]
            },
            ui: {
              ...state.ui,
              activeView: ROLE_DEFAULT_VIEW[nextRole]
            }
          };
        }

        case "SET_ACTIVE_VIEW":
          return VIEWS.includes(action.payload)
            ? {
                ...state,
                ui: {
                  ...state.ui,
                  activeView: action.payload
                }
              }
            : state;

        case "SET_MATCH_STEP":
          return {
            ...state,
            ui: {
              ...state.ui,
              matchWizardStep: Math.max(
                0,
                Math.min(3, Number(action.payload) || 0)
              )
            }
          };

        case "SHOW_TOAST": {
          const toast = {
            id:
              typeof crypto !== "undefined" && crypto.randomUUID
                ? crypto.randomUUID()
                : `toast-${Date.now()}-${Math.random()
                    .toString(36)
                    .slice(2)}`,
            message: String(action.payload?.message || ""),
            kind: action.payload?.kind || "info"
          };

          return {
            ...state,
            ui: {
              ...state.ui,
              toastQueue: [...state.ui.toastQueue, toast]
            }
          };
        }

        case "DISMISS_TOAST":
          return {
            ...state,
            ui: {
              ...state.ui,
              toastQueue: state.ui.toastQueue.filter(
                (toast) => toast.id !== action.payload
              )
            }
          };

        case "OPEN_DRAWER":
          return {
            ...state,
            ui: {
              ...state.ui,
              activeDrawer: action.payload,
              activeModal: null
            }
          };

        case "CLOSE_DRAWER":
          return {
            ...state,
            ui: {
              ...state.ui,
              activeDrawer: null
            }
          };

        case "OPEN_MODAL":
          return {
            ...state,
            ui: {
              ...state.ui,
              activeModal: action.payload,
              activeDrawer: null
            }
          };

        case "CLOSE_MODAL":
          return {
            ...state,
            ui: {
              ...state.ui,
              activeModal: null
            }
          };

        case "MATCH_UPDATE_REQUIREMENTS":
          return {
            ...state,
            matchDraft: {
              ...state.matchDraft,
              ...action.payload
            }
          };

        case "MATCH_RUN": {
          // Only the requirement snapshot is stored. Results are derived from
          // it, so a ranking can never drift out of step with its inputs.
          return {
            ...state,
            matchRun: {
              requirements: cloneJson(state.matchDraft),
              summary: summariseRequirements(state.matchDraft),
              ranAt: action.payload?.ranAt || new Date().toISOString()
            },
            matchShortlist: [],
            matchRejections: {},
            matchConfirmation: null,
            ui: { ...state.ui, matchWizardStep: 3 }
          };
        }

        case "MATCH_ADD_TO_SHORTLIST": {
          const plantId = action.payload.plantId;

          if (state.matchShortlist.some((line) => line.plantId === plantId)) {
            return state;
          }

          return {
            ...state,
            matchShortlist: [
              ...state.matchShortlist,
              {
                plantId,
                quantity: Math.max(1, Number(action.payload.quantity) || 1),
                addonIds: []
              }
            ]
          };
        }

        case "MATCH_REMOVE_FROM_SHORTLIST":
          return {
            ...state,
            matchShortlist: state.matchShortlist.filter(
              (line) => line.plantId !== action.payload.plantId
            )
          };

        case "MATCH_SET_SHORTLIST_QUANTITY":
          return {
            ...state,
            matchShortlist: state.matchShortlist.map((line) =>
              line.plantId === action.payload.plantId
                ? { ...line, quantity: Math.max(1, Number(action.payload.quantity) || 1) }
                : line
            )
          };

        case "MATCH_TOGGLE_ADDON":
          return {
            ...state,
            matchShortlist: state.matchShortlist.map((line) => {
              if (line.plantId !== action.payload.plantId) {
                return line;
              }

              const has = line.addonIds.includes(action.payload.addonId);

              return {
                ...line,
                addonIds: has
                  ? line.addonIds.filter((id) => id !== action.payload.addonId)
                  : [...line.addonIds, action.payload.addonId]
              };
            })
          };

        case "MATCH_RECORD_REJECTION": {
          const { plantId, reasonId, note } = action.payload;
          const label = state.matchRun ? state.matchRun.summary : "Unrecorded requirement";
          const seenAt = action.payload.seenAt || new Date().toISOString();

          const existingIndex = state.demandSignals.findIndex(
            (signal) => signal.label === label
          );

          const demandSignals =
            existingIndex >= 0
              ? state.demandSignals.map((signal, index) =>
                  index === existingIndex
                    ? {
                        ...signal,
                        requests: signal.requests + 1,
                        lastSeenAt: seenAt,
                        reasonCounts: {
                          ...signal.reasonCounts,
                          [reasonId]: (signal.reasonCounts[reasonId] || 0) + 1
                        }
                      }
                    : signal
                )
              : [
                  ...state.demandSignals,
                  {
                    id: `demand-${label.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40)}`,
                    label,
                    requests: 1,
                    matched: true,
                    lastSeenAt: seenAt,
                    reasonCounts: { [reasonId]: 1 }
                  }
                ];

          return {
            ...state,
            matchShortlist: state.matchShortlist.filter(
              (line) => line.plantId !== plantId
            ),
            matchRejections: {
              ...state.matchRejections,
              [plantId]: { reasonId, note: note || "" }
            },
            plants: state.plants.map((plant) =>
              plant.id === plantId
                ? {
                    ...plant,
                    analytics: {
                      ...plant.analytics,
                      rejected30d: plant.analytics.rejected30d + 1
                    }
                  }
                : plant
            ),
            demandSignals
          };
        }

        case "MATCH_SET_FOLLOW_UP":
          return {
            ...state,
            matchDraft: {
              ...state.matchDraft,
              followUpRequested: Boolean(action.payload)
            }
          };

        case "MATCH_SAVE_SESSION": {
          if (!state.matchRun) {
            return state;
          }

          const createdAt = action.payload?.createdAt || new Date().toISOString();
          const sessionId = action.payload?.id || `match-${createdAt}-${state.matchSessions.length + 1}`;
          const rankedPlantIds = action.payload?.rankedPlantIds || [];
          const matched = rankedPlantIds.length > 0;
          const basket = Number(action.payload?.estimatedBasketGBP) || 0;

          const rejected = Object.entries(state.matchRejections).map(
            ([plantId, entry]) => ({ plantId, reasonId: entry.reasonId, note: entry.note })
          );

          /* status is "shortlist-created", never "sold". Timber records that a
             shortlist was produced; whether the customer bought is an EPOS
             fact this demonstrator does not have and must not imply. */
          const session = {
            id: sessionId,
            siteId: state.meta.activeSiteId,
            staffId: state.meta.activeUserId,
            createdAt,
            requirementSummary: state.matchRun.summary,
            requirements: cloneJson(state.matchRun.requirements),
            rankedPlantIds,
            shortlist: state.matchShortlist.map((line) => ({
              plantId: line.plantId,
              quantity: line.quantity,
              addonIds: line.addonIds
            })),
            shortlistedPlantIds: state.matchShortlist.map((line) => line.plantId),
            rejected,
            estimatedBasketGBP: basket,
            status: "shortlist-created",
            followUp: {
              requested: Boolean(state.matchDraft.followUpRequested),
              dueAt: state.matchDraft.followUpRequested
                ? action.payload?.followUpDueAt || null
                : null
            }
          };

          const label = state.matchRun.summary;
          const existingIndex = state.demandSignals.findIndex(
            (signal) => signal.label === label
          );

          const demandSignals =
            existingIndex >= 0
              ? state.demandSignals.map((signal, index) =>
                  index === existingIndex
                    ? { ...signal, requests: signal.requests + 1, matched: signal.matched && matched, lastSeenAt: createdAt }
                    : signal
                )
              : [
                  ...state.demandSignals,
                  {
                    id: `demand-${label.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40)}`,
                    label,
                    requests: 1,
                    matched,
                    lastSeenAt: createdAt,
                    reasonCounts: {}
                  }
                ];

          const shortlisted = new Set(session.shortlistedPlantIds);

          return {
            ...state,
            matchSessions: [...state.matchSessions, session],
            demandSignals,
            plants: state.plants.map((plant) => {
              if (!rankedPlantIds.includes(plant.id)) {
                return plant;
              }

              return {
                ...plant,
                analytics: {
                  ...plant.analytics,
                  recommendations30d: plant.analytics.recommendations30d + 1,
                  customerRequests30d: plant.analytics.customerRequests30d + 1,
                  accepted30d: shortlisted.has(plant.id)
                    ? plant.analytics.accepted30d + 1
                    : plant.analytics.accepted30d
                }
              };
            }),
            matchConfirmation: {
              sessionId,
              basket,
              shortlistCount: session.shortlist.length,
              rejectedCount: rejected.length,
              followUpRequested: session.followUp.requested
            }
          };
        }

        case "MATCH_RESET":
          return {
            ...state,
            matchDraft: cloneJson(DEMO_STATE.matchDraft),
            matchRun: null,
            matchShortlist: [],
            matchRejections: {},
            matchConfirmation: null,
            ui: { ...state.ui, matchWizardStep: 0 }
          };

        case "ACTION_ASSIGN":
        case "ACTION_RESOLVE":
        case "ACTION_REOPEN": {
          const status =
            action.type === "ACTION_RESOLVE"
              ? "resolved"
              : action.type === "ACTION_ASSIGN"
                ? "assigned"
                : "pending";

          const id = action.payload.id;
          const existing = state.actionItems.findIndex((item) => item.id === id);

          const record = {
            id,
            status,
            ownerId:
              action.type === "ACTION_ASSIGN"
                ? action.payload.ownerId || state.meta.activeUserId
                : action.type === "ACTION_REOPEN"
                  ? null
                  : state.actionItems[existing]?.ownerId || null,
            note: action.payload.note || ""
          };

          return {
            ...state,
            actionItems:
              existing >= 0
                ? state.actionItems.map((item, index) => (index === existing ? record : item))
                : [...state.actionItems, record]
          };
        }

        case "RESET_DEMO":
          return cloneSeed();

        case "RECORD_ACTIVITY": {
          const event = {
            id:
              typeof crypto !== "undefined" && crypto.randomUUID
                ? crypto.randomUUID()
                : `event-${Date.now()}-${Math.random()
                    .toString(36)
                    .slice(2)}`,
            type: action.payload?.type || "UNKNOWN",
            actorId: state.meta.activeUserId,
            entityType: action.payload?.entityType || "unknown",
            entityId: action.payload?.entityId || null,
            siteId: state.meta.activeSiteId,
            createdAt: new Date().toISOString(),
            summary: action.payload?.summary || "",
            metadata: action.payload?.metadata || {}
          };

          return {
            ...state,
            activityEvents: [...state.activityEvents, event]
          };
        }

        default:
          return state;
      }
    }

    // ============================================================
    // 05A. DERIVED SELECTORS
    //
    // The Today queue is computed from the catalogue, the curator queue, the
    // demand signals and the sessions. Nothing is hand-listed, so resolving a
    // curator item or saving a session changes the queue on the next render.
    // state.actionItems holds only the manual overrides (assigned / resolved).
    // ============================================================
    const ACTION_TYPE_META = {
      "compliance-warning": { urgency: "high", roles: ["manager", "buyer"] },
      "curator-approval": { urgency: "high", roles: ["manager"] },
      "missing-toxicity": { urgency: "high", roles: ["manager"] },
      "taxonomy-uncertainty": { urgency: "medium", roles: ["manager"] },
      "missing-photograph": { urgency: "low", roles: ["manager"] },
      "no-stock-demand": { urgency: "high", roles: ["buyer"] },
      "slow-moving-stock": { urgency: "medium", roles: ["buyer", "manager"] },
      "match-follow-up": { urgency: "high", roles: ["floor", "manager"] },
      "learning-due": { urgency: "medium", roles: ["floor"] },
      "new-delivery": { urgency: "medium", roles: ["floor"] }
    };

    const URGENCY_ORDER = { high: 0, medium: 1, low: 2 };

    function deriveActionItems(state) {
      const items = [];
      const push = (type, key, title, why, entityType, entityId) => {
        items.push({
          id: `${type}:${key}`,
          type,
          urgency: ACTION_TYPE_META[type].urgency,
          roles: ACTION_TYPE_META[type].roles,
          title,
          why,
          entityType,
          entityId
        });
      };

      for (const plant of state.plants) {
        const name = plant.names.display;

        if (plant.safety.compliance.status === "hold") {
          push("compliance-warning", plant.id, `${name} is on compliance hold`,
            plant.safety.compliance.warnings[0] || "Cannot be recommended for sale until cleared.",
            "plant", plant.id);
        } else if (plant.safety.compliance.status === "unknown") {
          push("compliance-warning", plant.id, `${name} has no compliance record`,
            "Plant passport status is not recorded for this line.", "plant", plant.id);
        }

        const toxicity = plant.safety.toxicity;

        if (["humans", "cats", "dogs"].some((key) => toxicity[key] === "unknown")) {
          push("missing-toxicity", plant.id, `${name} has unverified toxicity`,
            "Staff cannot answer a pet-safety question on this plant. Unknown is not safe.",
            "plant", plant.id);
        }

        if (plant.intelligence.confidence < 70) {
          push("taxonomy-uncertainty", plant.id, `${name} is not confirmed`,
            `Research confidence is ${plant.intelligence.confidence}%. ${plant.intelligence.uncertainty[0] || ""}`.trim(),
            "plant", plant.id);
        }

        if (plant.images.length === 0) {
          push("missing-photograph", plant.id, `${name} has no photograph`,
            "Cannot be shown to a customer or used in a learning card.", "plant", plant.id);
        }

        if (plant.merchandising.promotionCandidate) {
          push("slow-moving-stock", plant.id, `${name} is moving slowly`,
            `${stockAtSite(plant, state.meta.activeSiteId)} in stock against ${plant.analytics.customerRequests30d} requests in 30 days.`,
            "plant", plant.id);
        }

        if (plant.learning.teamMastery < 40) {
          push("new-delivery", plant.id, `Team cannot recommend ${name}`,
            `Team mastery is ${plant.learning.teamMastery}%.`, "plant", plant.id);
        }
      }

      for (const item of state.curatorItems) {
        if (item.status === "published" || item.status === "rejected") {
          continue;
        }

        push("curator-approval", item.id, `${item.displayName} — ${item.status.replace(/-/g, " ")}`,
          item.uncertaintyCount > 0
            ? `${item.uncertaintyCount} unresolved research question(s).`
            : "Waiting in the documentation pipeline.",
          "curatorItem", item.id);
      }

      for (const signal of state.demandSignals) {
        if (signal.matched) {
          continue;
        }

        push("no-stock-demand", signal.id, `"${signal.label}" — nothing to sell`,
          `Asked for ${signal.requests} times with no saleable match.`, "demandSignal", signal.id);
      }

      for (const session of state.matchSessions) {
        if (!session.followUp.requested) {
          continue;
        }

        push("match-follow-up", session.id, `Follow up: ${session.requirementSummary}`,
          "The customer asked to be contacted.", "matchSession", session.id);
      }

      for (const assignment of state.learningAssignments) {
        if (assignment.status !== "open") {
          continue;
        }

        const member = state.staff.find((person) => person.id === assignment.staffId);

        push("learning-due", assignment.id, `${assignment.packLabel} due for ${member ? member.name : "a colleague"}`,
          `${assignment.plantIds.length} plant(s), due ${assignment.dueLabel.toLowerCase()}.`,
          "learningAssignment", assignment.id);
      }

      const overrides = new Map(state.actionItems.map((item) => [item.id, item]));

      return items.map((item) => {
        const override = overrides.get(item.id);

        return {
          ...item,
          status: override ? override.status : "pending",
          ownerId: override ? override.ownerId : null,
          note: override ? override.note : ""
        };
      });
    }

    function sortActionItemsForRole(items, role) {
      return items.slice().sort((a, b) => {
        const aMine = a.roles.includes(role) ? 0 : 1;
        const bMine = b.roles.includes(role) ? 0 : 1;

        if (aMine !== bMine) return aMine - bMine;

        const urgency = URGENCY_ORDER[a.urgency] - URGENCY_ORDER[b.urgency];
        if (urgency !== 0) return urgency;

        return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
      });
    }

    function topDemandSignals(state, limit = 6) {
      return state.demandSignals
        .slice()
        .sort((a, b) => {
          if (a.matched !== b.matched) return a.matched ? 1 : -1;
          if (b.requests !== a.requests) return b.requests - a.requests;
          return a.id < b.id ? -1 : 1;
        })
        .slice(0, limit);
    }

    function rejectionReasonTotals(state) {
      const totals = {};

      for (const signal of state.demandSignals) {
        for (const [reasonId, count] of Object.entries(signal.reasonCounts || {})) {
          totals[reasonId] = (totals[reasonId] || 0) + count;
        }
      }

      for (const session of state.matchSessions) {
        for (const entry of session.rejected || []) {
          totals[entry.reasonId] = (totals[entry.reasonId] || 0) + 1;
        }
      }

      return Object.entries(totals)
        .map(([reasonId, count]) => ({
          reasonId,
          count,
          label: (REJECTION_REASONS.find((reason) => reason.id === reasonId) || { label: reasonId }).label
        }))
        .sort((a, b) => b.count - a.count || (a.reasonId < b.reasonId ? -1 : 1));
    }

    // ============================================================
    // 06. TOAST TIMER SERVICE
    // ============================================================
    class ToastTimerService {
      constructor(setTimeoutFn, clearTimeoutFn) {
        this.setTimeoutFn = setTimeoutFn;
        this.clearTimeoutFn = clearTimeoutFn;
        this.timers = new Map();
        this.paused = new Set();
        this.onDismiss = null;
      }

      setOnDismiss(callback) {
        this.onDismiss = callback;
      }

      add(id) {
        if (this.timers.has(id) || this.paused.has(id)) {
          return;
        }

        const timerId = this.setTimeoutFn(() => {
          this.timers.delete(id);

          if (this.onDismiss) {
            this.onDismiss(id);
          }
        }, 5000);

        this.timers.set(id, timerId);
      }

      remove(id) {
        if (this.timers.has(id)) {
          this.clearTimeoutFn(this.timers.get(id));
          this.timers.delete(id);
        }

        this.paused.delete(id);
      }

      pause(id) {
        if (this.timers.has(id)) {
          this.clearTimeoutFn(this.timers.get(id));
          this.timers.delete(id);
        }

        this.paused.add(id);
      }

      resume(id) {
        this.paused.delete(id);
        this.add(id);
      }

      sync(activeIds) {
        const activeSet = new Set(activeIds);

        for (const id of Array.from(this.timers.keys())) {
          if (!activeSet.has(id)) {
            this.remove(id);
          }
        }

        for (const id of Array.from(this.paused)) {
          if (!activeSet.has(id)) {
            this.remove(id);
          }
        }

        for (const id of activeIds) {
          this.add(id);
        }
      }

      destroy() {
        for (const timerId of this.timers.values()) {
          this.clearTimeoutFn(timerId);
        }

        this.timers.clear();
        this.paused.clear();
      }

      hasTimer(id) {
        return this.timers.has(id);
      }

      isPaused(id) {
        return this.paused.has(id);
      }
    }

    // ============================================================
    // 07. FOCUS AND OVERLAY HELPERS
    // ============================================================
    function getFocusableElements(container) {
      if (!container) {
        return [];
      }

      return Array.from(
        container.querySelectorAll(
          [
            "button:not([disabled])",
            "[href]",
            "input:not([disabled])",
            "select:not([disabled])",
            "textarea:not([disabled])",
            "[tabindex]:not([tabindex='-1'])"
          ].join(",")
        )
      ).filter(
        (element) =>
          !element.hasAttribute("hidden") &&
          element.getAttribute("aria-hidden") !== "true"
      );
    }

    function installFocusTrap(panel, onEscape) {
      if (!panel) {
        return () => {};
      }

      const handleKeyDown = (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          onEscape();
          return;
        }

        if (event.key !== "Tab") {
          return;
        }

        const focusable = getFocusableElements(panel);

        if (focusable.length === 0) {
          event.preventDefault();
          panel.focus();
          return;
        }

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (
          !event.shiftKey &&
          document.activeElement === last
        ) {
          event.preventDefault();
          first.focus();
        }
      };

      panel.addEventListener("keydown", handleKeyDown);

      return () => {
        panel.removeEventListener("keydown", handleKeyDown);
      };
    }

    function usePortalDialog(isOpen, panelRef, onClose) {
      const triggerRef = React.useRef(null);
      const closeRef = React.useRef(onClose);
      const previousBodyOverflowRef = React.useRef("");
      const trapCleanupRef = React.useRef(() => {});

      React.useEffect(() => {
        closeRef.current = onClose;
      }, [onClose]);

      React.useEffect(() => {
        if (!isOpen) {
          return undefined;
        }

        triggerRef.current = document.activeElement;
        const appShell = document.querySelector(".app-shell");

        if (appShell) {
          appShell.inert = true;
          appShell.setAttribute("aria-hidden", "true");
        }

        previousBodyOverflowRef.current = document.body.style.overflow;
        document.body.style.overflow = "hidden";

        const focusTimer = window.setTimeout(() => {
          const panel = panelRef.current;

          if (!panel) {
            return;
          }

          const focusable = getFocusableElements(panel);

          if (focusable.length > 0) {
            focusable[0].focus();
          } else {
            panel.focus();
          }

          trapCleanupRef.current = installFocusTrap(panel, () => {
            closeRef.current();
          });
        }, 0);

        return () => {
          window.clearTimeout(focusTimer);
          trapCleanupRef.current();
          trapCleanupRef.current = () => {};

          document.body.style.overflow =
            previousBodyOverflowRef.current;

          if (appShell) {
            appShell.inert = false;
            appShell.removeAttribute("aria-hidden");
          }

          const trigger = triggerRef.current;

          if (trigger && document.contains(trigger)) {
            trigger.focus();
          }
        };
      }, [isOpen, panelRef]);
    }

    // ============================================================
    // 08. SHARED UI COMPONENTS
    // ============================================================
    function Modal({ isOpen, title, children, onClose }) {
      const panelRef = React.useRef(null);
      const titleId = React.useId();

      usePortalDialog(isOpen, panelRef, onClose);

      if (!isOpen) {
        return null;
      }

      return ReactDOM.createPortal(
        <div
          className="modal-overlay"
          onMouseDown={(event) => {
            if (event.target === event.currentTarget) {
              onClose();
            }
          }}
        >
          <section
            ref={panelRef}
            className="modal-box"
            role="dialog"
            aria-modal="true"
            aria-labelledby={titleId}
            tabIndex="-1"
          >
            <div className="dialog-heading">
              <h2 id={titleId}>{title}</h2>
              <button
                type="button"
                className="icon-button"
                onClick={onClose}
                aria-label={`Close ${title}`}
              >
                ✕
              </button>
            </div>
            {children}
          </section>
        </div>,
        document.getElementById("overlay-root")
      );
    }

    function Drawer({ isOpen, title, children, onClose }) {
      const panelRef = React.useRef(null);
      const titleId = React.useId();

      usePortalDialog(isOpen, panelRef, onClose);

      if (!isOpen) {
        return null;
      }

      return ReactDOM.createPortal(
        <div
          className="drawer-overlay"
          onMouseDown={(event) => {
            if (event.target === event.currentTarget) {
              onClose();
            }
          }}
        >
          <aside
            ref={panelRef}
            className="drawer-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby={titleId}
            tabIndex="-1"
          >
            <div className="dialog-heading">
              <h2 id={titleId}>{title}</h2>
              <button
                type="button"
                className="icon-button"
                onClick={onClose}
                aria-label={`Close ${title}`}
              >
                ✕
              </button>
            </div>
            {children}
          </aside>
        </div>,
        document.getElementById("overlay-root")
      );
    }

    function ToastContainer({ queue, onDismiss }) {
      const serviceRef = React.useRef(null);

      if (serviceRef.current === null) {
        serviceRef.current = new ToastTimerService(
          window.setTimeout.bind(window),
          window.clearTimeout.bind(window)
        );
      }

      const service = serviceRef.current;

      React.useEffect(() => {
        service.setOnDismiss(onDismiss);
      }, [service, onDismiss]);

      React.useEffect(() => {
        service.sync(queue.map((toast) => toast.id));
      }, [queue, service]);

      React.useEffect(
        () => () => {
          service.destroy();
        },
        [service]
      );

      if (queue.length === 0) {
        return null;
      }

      return (
        <div
          className="toast-container"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        >
          {queue.map((toast) => (
            <div
              key={toast.id}
              className="toast"
              onMouseEnter={() => service.pause(toast.id)}
              onMouseLeave={() => service.resume(toast.id)}
              onFocusCapture={() => service.pause(toast.id)}
              onBlurCapture={(event) => {
                if (!event.currentTarget.contains(event.relatedTarget)) {
                  service.resume(toast.id);
                }
              }}
            >
              <span>{toast.message}</span>
              <button
                type="button"
                className="toast-close"
                aria-label="Dismiss notification"
                onClick={() => {
                  service.remove(toast.id);
                  onDismiss(toast.id);
                }}
              >
                ✕
              </button>
            </div>
          ))}
        </div>
      );
    }

    // ============================================================
    // 09. VIEW COMPONENTS
    // ============================================================
    function Field({ label, hint, children }) {
      const id = React.useId();

      return (
        <div className="field">
          <label className="field-label" htmlFor={id}>
            {label}
          </label>
          {React.cloneElement(children, { id })}
          {hint && <span className="field-hint">{hint}</span>}
        </div>
      );
    }

    function StrictnessToggle({ value, onChange, label }) {
      return (
        <div
          className="strictness"
          role="group"
          aria-label={`How strict is ${label}?`}
        >
          {STRICTNESS_VALUES.map((option) => (
            <button
              key={option}
              type="button"
              className={value === option ? "active" : ""}
              aria-pressed={value === option}
              onClick={() => onChange(option)}
            >
              {option === "required"
                ? "Must have"
                : option === "preferred"
                  ? "Prefer"
                  : "Not fussed"}
            </button>
          ))}
        </div>
      );
    }

    function ToxicityBadge({ toxicity }) {
      const values = [toxicity.humans, toxicity.cats, toxicity.dogs];

      if (values.includes("toxic")) {
        return (
          <span className="badge badge-danger" title={toxicity.notes}>
            ⚠ Toxic — {toxicity.severity}
          </span>
        );
      }

      if (values.includes("unknown")) {

    // Deterministic pattern standing in for a real QR code. Derived from the
    // session id so it is stable across renders — it is not a scannable code
    // and is labelled as simulated wherever it appears.
    function SimulatedQr({ seed }) {
      const cells = React.useMemo(() => {
        let hash = 7;

        for (let index = 0; index < seed.length; index += 1) {
          hash = (hash * 31 + seed.charCodeAt(index)) % 100000;
        }

        return Array.from({ length: 121 }, (_, index) => {
          const value = (hash * (index + 3)) % 17;
          const edge = index < 11 || index > 109 || index % 11 === 0 || index % 11 === 10;
          return edge ? (index + hash) % 3 === 0 : value > 8;
        });
      }, [seed]);

      return (
        <div className="qr" role="img" aria-label="Simulated QR code for the demonstration customer link">
          {cells.map((filled, index) => (
            <span key={index} className={filled ? "on" : ""} />
          ))}
        </div>
      );
    }

    function MatchView({ state, dispatch, onToast }) {
      const { matchDraft, matchRun, matchShortlist, matchRejections, matchConfirmation, ui, meta } = state;

      const plantsById = React.useMemo(
        () => new Map(state.plants.map((plant) => [plant.id, plant])),
        [state.plants]
      );

      const results = React.useMemo(() => {
        if (!matchRun) {
          return null;
        }

        return runMatch(state.plants, matchRun.requirements, { siteId: meta.activeSiteId });
      }, [matchRun, state.plants, meta.activeSiteId]);

      const [showUnavailable, setShowUnavailable] = React.useState(false);

      const totals = React.useMemo(() => {
        let plantsTotal = 0;
        let addonsTotal = 0;

        for (const line of matchShortlist) {
          const plant = plantsById.get(line.plantId);

          if (!plant) continue;

          plantsTotal += plant.commercial.priceGBP * line.quantity;

          for (const addonId of line.addonIds) {
            const addon = ADDON_PRODUCTS.find((entry) => entry.id === addonId);
            if (addon) addonsTotal += addon.priceGBP;
          }
        }

        return {
          plants: plantsTotal,
          addons: addonsTotal,
          total: plantsTotal + addonsTotal
        };
      }, [matchShortlist, plantsById]);

      const openScore = (plantId) =>
        dispatch({ type: "OPEN_DRAWER", payload: { kind: "score-inspection", plantId } });

      const openReject = (plantId) =>
        dispatch({ type: "OPEN_MODAL", payload: { kind: "rejection", plantId } });

      const handleSave = () => {
        const rankedPlantIds = results
          ? results.eligible.concat(results.verification).map((entry) => entry.plantId)
          : [];

        dispatch({
          type: "MATCH_SAVE_SESSION",
          payload: { rankedPlantIds, estimatedBasketGBP: totals.total }
        });

        dispatch({
          type: "RECORD_ACTIVITY",
          payload: {
            type: "MATCH_SESSION_SAVED",
            entityType: "matchSession",
            summary: `Saved a ${matchShortlist.length}-plant shortlist`
          }
        });

        onToast("Session saved as a shortlist — not recorded as a sale.");
      };

      const copyLink = (link) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(
            () => onToast("Demonstration link copied."),
            () => onToast("Could not copy — select the link and copy manually.")
          );
          return;
        }

        onToast("Clipboard unavailable — select the link and copy manually.");
      };

      const renderResults = () => {
        if (!results) {
          return (
            <section className="panel results-empty" aria-label="Recommendations">
              <h2>No search run yet</h2>
              <p className="text-sm text-muted">
                Describe the position on the left, then press{" "}
                <strong>Show matches</strong>. Timber ranks only what is on the
                bench today.
              </p>
            </section>
          );
        }

        const nothingSaleable = results.eligible.length === 0;

        return (
          <div className="stack">
            <div className="results-summary panel">
              <div className="flex-between">
                <div>
                  <h2>{results.eligible.length} can be sold today</h2>
                  <p className="text-sm text-muted">{matchRun.summary}</p>
                </div>
                <button
                  type="button"
                  className="btn btn-sm btn-outline"
                  onClick={() => dispatch({ type: "MATCH_RESET" })}
                >
                  Start again
                </button>
              </div>
            </div>

            {nothingSaleable && (
              <div className="callout callout-warn">
                <h3>Nothing in stock matches this requirement</h3>
                <p>
                  Saving the session records that as unmet demand, which is what
                  the buyer needs to see. Check the panels below for anything
                  that could be verified or ordered.
                </p>
              </div>
            )}

            {results.eligible.map((result) => (
              <ResultCard
                key={result.plantId}
                result={result}
                plant={plantsById.get(result.plantId)}
                siteId={meta.activeSiteId}
                shortlisted={matchShortlist.some((line) => line.plantId === result.plantId)}
                rejection={matchRejections[result.plantId]}
                onInspect={() => openScore(result.plantId)}
                onShortlist={() =>
                  dispatch({
                    type: "MATCH_ADD_TO_SHORTLIST",
                    payload: { plantId: result.plantId, quantity: matchRun.requirements.quantity }
                  })
                }
                onReject={() => openReject(result.plantId)}
                onSubstitute={() => {
                  const substituteId = result.substituteIds.find((id) => {
                    const candidate = plantsById.get(id);
                    return candidate && stockAtSite(candidate, meta.activeSiteId) > 0;
                  });

                  if (!substituteId) {
                    onToast("No substitute for that plant is in stock today.");
                    return;
                  }

                  dispatch({
                    type: "MATCH_ADD_TO_SHORTLIST",
                    payload: { plantId: substituteId, quantity: matchRun.requirements.quantity }
                  });

                  onToast(
                    `Added ${plantsById.get(substituteId).names.display} as a substitute.`
                  );
                }}
              />
            ))}

            {results.verification.length > 0 && (
              <section className="result-group" aria-label="Needs verification">
                <h2>Needs verification before recommending ({results.verification.length})</h2>
                <p className="text-sm text-muted">
                  These fit the brief but carry unverified safety data. Unknown
                  is not the same as safe — check before offering them.
                </p>

                {results.verification.map((result) => (
                  <ResultCard
                    key={result.plantId}
                    variant="verify"
                    result={result}
                    plant={plantsById.get(result.plantId)}
                    siteId={meta.activeSiteId}
                    shortlisted={matchShortlist.some((line) => line.plantId === result.plantId)}
                    rejection={matchRejections[result.plantId]}
                    onInspect={() => openScore(result.plantId)}
                    onReject={() => openReject(result.plantId)}
                  />
                ))}
              </section>
            )}

            {results.unavailable.length > 0 && (
              <section className="result-group" aria-label="Not available">
                <button
                  type="button"
                  className="btn btn-outline w-full"
                  aria-expanded={showUnavailable}
                  onClick={() => setShowUnavailable((open) => !open)}
                >
                  {showUnavailable ? "Hide" : "Show"} {results.unavailable.length} ruled
                  out, and why
                </button>

                {showUnavailable &&
                  results.unavailable.slice(0, 12).map((result) => (
                    <ResultCard
                      key={result.plantId}
                      variant="unavailable"
                      result={result}
                      plant={plantsById.get(result.plantId)}
                      siteId={meta.activeSiteId}
                      onInspect={() => openScore(result.plantId)}
                    />
                  ))}
              </section>
            )}
          </div>
        );
      };

      return (
        <>
          <div className="view-header">
            <div>
              <h1>Customer Match</h1>
              <p className="text-muted">
                From a vague requirement to a safe, explainable, in-stock
                recommendation.
              </p>
            </div>
            <span className="badge badge-demo">Demo stock — not EPOS</span>
          </div>

          <div className="match-layout">
            <RequirementWizard
              draft={matchDraft}
              step={ui.matchWizardStep}
              dispatch={dispatch}
              onRun={() => dispatch({ type: "MATCH_RUN" })}
            />

            <div className="match-results">{renderResults()}</div>

            <ShortlistPanel
              shortlist={matchShortlist}
              plantsById={plantsById}
              totals={totals}
              draft={matchDraft}
              dispatch={dispatch}
              confirmation={matchConfirmation}
              quantityChange={(plantId, quantity) =>
                dispatch({ type: "MATCH_SET_SHORTLIST_QUANTITY", payload: { plantId, quantity } })
              }
              toggleAddon={(plantId, addonId) =>
                dispatch({ type: "MATCH_TOGGLE_ADDON", payload: { plantId, addonId } })
              }
              remove={(plantId) =>
                dispatch({ type: "MATCH_REMOVE_FROM_SHORTLIST", payload: { plantId } })
              }
              onSave={handleSave}
              onPrint={() => window.print()}
              onCopyLink={copyLink}
              onStartAnother={() => dispatch({ type: "MATCH_RESET" })}
            />
          </div>

          {matchConfirmation && (
            <section className="print-only" aria-hidden="true">
              <h2>Timber plant recommendation — demonstration</h2>
              <p>{matchRun ? matchRun.summary : ""}</p>
              <ul>
                {matchShortlist.map((line) => {
                  const plant = plantsById.get(line.plantId);
                  if (!plant) return null;

                  return (
                    <li key={line.plantId}>
                      <strong>{plant.names.display}</strong> ({plant.names.common}) ×{" "}
                      {line.quantity} — {plant.commercial.potSize},{" "}
                      {GBP.format(plant.commercial.priceGBP)} each.{" "}
                      {plant.care.prune} {plant.safety.toxicity.notes}
                    </li>
                  );
                })}
              </ul>
              <p>
                Estimated total {GBP.format(matchConfirmation.basket)}. Demonstration
                recommendation — prices and stock are not live.
              </p>
            </section>
          )}
        </>
      );
    }

    // ============================================================
    // 10. ERROR BOUNDARY
    // ============================================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = {
          hasError: false
        };
      }

      static getDerivedStateFromError() {
        return {
          hasError: true
        };
      }

      componentDidCatch(error, info) {
        console.error("Timber: uncaught render error.", error, info);
      }

      render() {
        if (!this.state.hasError) {
          return this.props.children;
        }

        return (
          <div className="fallback-shell">
            <div className="fallback">
              <h1>Timber could not render</h1>
              <p className="text-muted">
                Reload the page or reset the local demonstration
                state.
              </p>
              <div
                className="stub-controls"
                style={{ marginTop: "1rem" }}
              >
                <button
                  type="button"
                  className="btn btn-primary"
                  onClick={() => window.location.reload()}
                >
                  Reload
                </button>
                <button
                  type="button"
                  className="btn btn-danger"
                  onClick={() => {
                    try {
                      window.localStorage.removeItem(STORAGE_KEY);
                    } catch (error) {
                      console.warn(
                        "Timber: could not clear local state.",
                        error
                      );
                    }

                    window.location.reload();
                  }}
                >
                  Reset demo
                </button>
              </div>
            </div>
          </div>
        );
      }
    }
