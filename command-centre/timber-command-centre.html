    // ============================================================
    function App() {
      const bootstrapRef = React.useRef(null);

      if (bootstrapRef.current === null) {
        const loadResult = loadStateFromStorage();

        bootstrapRef.current = {
          initialState: loadResult.state || cloneSeed(),
          bootstrapNotice: loadResult.notice
        };
      }

      const bootstrap = bootstrapRef.current;

      const [state, dispatch] = React.useReducer(
        reducer,
        bootstrap.initialState
      );

      const [persistentStorageError, setPersistentStorageError] =
        React.useState(null);

      const [lastSavedAtDisplay, setLastSavedAtDisplay] =
        React.useState(state.meta.lastSavedAt);

      const bootstrapNoticeShownRef = React.useRef(false);

      React.useEffect(() => {
        if (
          bootstrap.bootstrapNotice &&
          !bootstrapNoticeShownRef.current
        ) {
          bootstrapNoticeShownRef.current = true;

          dispatch({
            type: "SHOW_TOAST",
            payload: {
              message: bootstrap.bootstrapNotice,
              kind: "warning"
            }
          });
        }
      }, [bootstrap.bootstrapNotice]);

      const signaturePayload = React.useMemo(
        () => buildPersistentSignaturePayload(state),
        [state]
      );

      const persistentSignature = React.useMemo(
        () => JSON.stringify(signaturePayload),
        [signaturePayload]
      );

      const previousPersistentSignatureRef = React.useRef(
        persistentSignature
      );

      React.useEffect(() => {
        if (
          previousPersistentSignatureRef.current ===
          persistentSignature
        ) {
          return;
        }

        previousPersistentSignatureRef.current =
          persistentSignature;

        try {
          const savedAt = saveState(state);
          setLastSavedAtDisplay(savedAt);
          setPersistentStorageError(null);
        } catch (error) {
          console.warn(
            "Timber: changes are being kept in memory only.",
            error
          );

          setPersistentStorageError(
            "Changes are being kept in memory but may not survive reload."
          );
        }
      }, [persistentSignature]);

      const {
        meta,
        ui,
        plants,
        staff,
        actionItems,
        matchSessions,
        learningAssignments,
        curatorItems,
        valueProof
      } = state;

      const closeDrawer = React.useCallback(() => {
        dispatch({ type: "CLOSE_DRAWER" });
      }, []);

      const closeModal = React.useCallback(() => {
        dispatch({ type: "CLOSE_MODAL" });
      }, []);

      const dismissToast = React.useCallback((id) => {
        dispatch({
          type: "DISMISS_TOAST",
          payload: id
        });
      }, []);

      const showToast = React.useCallback((message, kind = "info") => {
        dispatch({
          type: "SHOW_TOAST",
          payload: { message, kind }
        });
      }, []);

      const handleReset = React.useCallback(() => {
        const confirmed = window.confirm(
          "Reset all Timber demo data?"
        );

        if (!confirmed) {
          return;
        }

        try {
          window.localStorage.removeItem(STORAGE_KEY);
        } catch (error) {
          console.warn(
            "Timber: could not clear local state during reset.",
            error
          );
        }

        dispatch({ type: "RESET_DEMO" });
        setLastSavedAtDisplay(null);
        setPersistentStorageError(null);

        dispatch({
          type: "SHOW_TOAST",
          payload: {
            message: "Demo reset to seed state."
          }
        });
      }, []);

      const [developerOpen, setDeveloperOpen] =
        React.useState(false);

      const [testResults, setTestResults] =
        React.useState(null);

      const developerTriggerRef = React.useRef(null);
      const developerPanelRef = React.useRef(null);
      const previousDeveloperOpenRef = React.useRef(false);

      React.useEffect(() => {
        const wasOpen = previousDeveloperOpenRef.current;

        if (developerOpen && !wasOpen) {
          const timer = window.setTimeout(() => {
            const panel = developerPanelRef.current;
            const focusable = getFocusableElements(panel);

            if (focusable.length > 0) {
              focusable[0].focus();
            } else if (panel) {
              panel.focus();
            }
          }, 0);

          previousDeveloperOpenRef.current = true;

          return () => {
            window.clearTimeout(timer);
          };
        }

        if (!developerOpen && wasOpen) {
          previousDeveloperOpenRef.current = false;
          developerTriggerRef.current?.focus();
        }

        return undefined;
      }, [developerOpen]);

      React.useEffect(() => {
        if (!developerOpen) {
          return undefined;
        }

        const handleKeyDown = (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            setDeveloperOpen(false);
          }
        };

        const handlePointerDown = (event) => {
          const panel = developerPanelRef.current;
          const trigger = developerTriggerRef.current;

          if (
            panel &&
            !panel.contains(event.target) &&
            trigger &&
            !trigger.contains(event.target)
          ) {
            setDeveloperOpen(false);
          }
        };

        document.addEventListener("keydown", handleKeyDown);
        document.addEventListener(
          "pointerdown",
          handlePointerDown
        );

        return () => {
          document.removeEventListener(
            "keydown",
            handleKeyDown
          );
          document.removeEventListener(
            "pointerdown",
            handlePointerDown
          );
        };
      }, [developerOpen]);

      const moreViews = ["learning", "curator", "value"];

      const bottomNavItems = [
        { id: "match", label: "Match", icon: "⌕" },
        { id: "today", label: "Today", icon: "✓" },
        { id: "plants", label: "Plants", icon: "♧" },
        { id: "more", label: "More", icon: "•••" }
      ];

      const setView = (view) => {
        dispatch({
          type: "SET_ACTIVE_VIEW",
          payload: view
        });
      };

      const renderView = () => {
        switch (ui.activeView) {
          case "match":
            return (
              <MatchView
                state={state}
                dispatch={dispatch}
                onToast={showToast}
              />
            );

          case "plants":
            return <PlantsView plants={plants} siteId={meta.activeSiteId} />;

          case "today":
            return (
              <TodayView
                state={state}
                dispatch={dispatch}
                onToast={showToast}
              />
            );

          case "learning":
            return (
              <LearningView
                staff={staff}
                assignments={learningAssignments}
              />
            );

          case "curator":
            return <CuratorView items={curatorItems} />;

          case "value":
            return (
              <ValueView
                assumptions={valueProof.assumptions}
              />
            );

          default:
            return null;
        }
      };

      // Drawers and modals carry the record they are about, so the overlay
      // always reflects the plant that was clicked rather than a copy.
      const overlayPlantId =
        (ui.activeDrawer && ui.activeDrawer.plantId) ||
        (ui.activeModal && ui.activeModal.plantId) ||
        null;

      const overlayPlant = React.useMemo(
        () =>
          overlayPlantId
            ? plants.find((plant) => plant.id === overlayPlantId) || null
            : null,
        [overlayPlantId, plants]
      );

      const overlayResult = React.useMemo(() => {
        if (!overlayPlant || !state.matchRun) {
          return null;
        }

        return scorePlant(overlayPlant, state.matchRun.requirements, {
          siteId: meta.activeSiteId
        });
      }, [overlayPlant, state.matchRun, meta.activeSiteId]);

      return (
        <div className="app-shell">
          {persistentStorageError && (
            <div className="storage-warning" role="status">
              {persistentStorageError}
            </div>
          )}

          <header className="app-header">
            <div className="container header-inner">
              <div className="logo">
                TIMBER <span>Command Centre</span>
              </div>

              <nav
                className="nav-links"
                aria-label="Main navigation"
              >
                {VIEWS.map((view) => (
                  <button
                    key={view}
                    type="button"
                    className={`nav-link ${
                      ui.activeView === view ? "active" : ""
                    }`}
                    aria-current={
                      ui.activeView === view ? "page" : undefined
                    }
                    onClick={() => setView(view)}
                  >
                    {VIEW_LABELS[view]}
                  </button>
                ))}
              </nav>

              <div className="header-actions">
                <select
                  className="role-selector"
                  aria-label="Demonstration role"
                  value={meta.activeRole}
                  onChange={(event) =>
                    dispatch({
                      type: "SET_ROLE",
                      payload: event.target.value
                    })
                  }
                >
                  {ROLES.map((role) => (
                    <option key={role} value={role}>
                      {ROLE_LABELS[role]}
                    </option>
                  ))}
                </select>

                <button
                  ref={developerTriggerRef}
                  type="button"
                  className="badge badge-demo"
                  aria-expanded={developerOpen}
                  aria-controls="timber-developer-panel"
                  onClick={() =>
                    setDeveloperOpen((open) => !open)
                  }
                >
                  Demo data
                </button>

                <button
                  type="button"
                  className="btn btn-outline btn-sm"
                  onClick={handleReset}
                >
                  Reset
                </button>
              </div>
            </div>
          </header>

          <main className="app-main">
            <div className="container">{renderView()}</div>
          </main>

          <nav
            className="bottom-nav"
            aria-label="Mobile navigation"
          >
            {bottomNavItems.map((item) => {
              const isMoreActive =
                item.id === "more" &&
                moreViews.includes(ui.activeView);

              const isActive =
                ui.activeView === item.id || isMoreActive;

              return (
                <button
                  key={item.id}
                  type="button"
                  className={isActive ? "active" : ""}
                  aria-current={isActive ? "page" : undefined}
                  onClick={() => {
                    if (item.id === "more") {
                      dispatch({
                        type: "OPEN_DRAWER",
                        payload: { kind: "more-navigation" }
                      });
                    } else {
                      setView(item.id);
                    }
                  }}
                >
                  <span className="nav-icon">
                    {item.icon}
                  </span>
                  <span>{item.label}</span>
                </button>
              );
            })}
          </nav>

          <Drawer
            isOpen={ui.activeDrawer?.kind === "more-navigation"}
            title="More Timber views"
            onClose={closeDrawer}
          >
            <div className="stack">
              {moreViews.map((view) => (
                <button
                  key={view}
                  type="button"
                  className="btn btn-outline w-full"
                  onClick={() => {
                    setView(view);
                    closeDrawer();
                  }}
                >
                  {VIEW_LABELS[view]}
                </button>
              ))}
            </div>
          </Drawer>

          <Modal
            isOpen={ui.activeModal?.kind === "rejection"}
            title="Why did the customer say no?"
            onClose={closeModal}
          >
            {overlayPlant ? (
              <RejectionForm
                plant={overlayPlant}
                onCancel={closeModal}
                onConfirm={(reasonId, note) => {
                  dispatch({
                    type: "MATCH_RECORD_REJECTION",
                    payload: { plantId: overlayPlant.id, reasonId, note }
                  });

                  dispatch({
                    type: "RECORD_ACTIVITY",
                    payload: {
                      type: "RECOMMENDATION_REJECTED",
                      entityType: "plant",
                      entityId: overlayPlant.id,
                      summary: `${overlayPlant.names.display} declined`,
                      metadata: { reasonId }
                    }
                  });

                  closeModal();
                  showToast("Recorded. The buyer's demand panel has changed.");
                }}
              />
            ) : (
              <p className="text-muted">That plant is no longer in the catalogue.</p>
            )}
          </Modal>

          <Drawer
            isOpen={ui.activeDrawer?.kind === "score-inspection"}
            title="How this score was reached"
            onClose={closeDrawer}
          >
            {overlayPlant && overlayResult ? (
              <ScoreBreakdown result={overlayResult} plant={overlayPlant} />
            ) : (
              <p className="text-muted">
                Run a search first — there is no score to inspect yet.
              </p>
            )}
          </Drawer>

          <ToastContainer
            queue={ui.toastQueue}
            onDismiss={dismissToast}
          />

          <section
            ref={developerPanelRef}
            id="timber-developer-panel"
            className={`dev-panel ${
              developerOpen ? "open" : ""
            }`}
            role="region"
            aria-label="Developer status"
            tabIndex="-1"
          >
            <div className="dev-heading">
              <h2>Developer status</h2>
              <button
                type="button"
                className="icon-button"
                aria-label="Close developer status"
                onClick={() => setDeveloperOpen(false)}
              >
                ✕
              </button>
            </div>

            <div className="stack">
              <p className="text-sm">
                Schema version: <strong>{SCHEMA_VERSION}</strong>
              </p>
              <p className="text-sm">
                Last persistent write:{" "}
                <strong>
                  {lastSavedAtDisplay
                    ? new Date(
                        lastSavedAtDisplay
                      ).toLocaleString("en-GB")
                    : "Not yet written"}
                </strong>
              </p>
              <p className="text-sm">
                Current persona:{" "}
                <strong>{ROLE_LABELS[meta.activeRole]}</strong>
              </p>

              <button
                type="button"
                className="btn btn-primary btn-sm"
                onClick={() => {
                  setTestResults(
                    window.runTimberSelfTests()
                  );
                }}
              >
                Run foundation self-tests
              </button>

              {testResults && (
                <>
                  <span
                    className={`badge ${
                      testResults.failed === 0
                        ? ""
                        : "badge-danger"
                    }`}
                  >
                    {testResults.summary}
                  </span>
                  <div className="test-results">
                    {testResults.results.map((result, index) => (
                      <div key={`${index}-${result}`}>
                        {result}
                      </div>
                    ))}
                  </div>
                </>
              )}
            </div>
          </section>
        </div>
      );
    }

    // ============================================================
    // 12. SIDE-EFFECT-FREE SELF-TESTS
    // ============================================================
    window.runTimberSelfTests = function runTimberSelfTests() {
      const results = [];
      let passed = 0;

      const assert = (condition, label) => {
        const success = Boolean(condition);

        results.push(`${success ? "✅" : "❌"} ${label}`);

        if (success) {
          passed += 1;
        }
      };

      const productionBefore =
        window.localStorage.getItem(STORAGE_KEY);

      try {
        const seed = cloneSeed();

        const managerState = reducer(seed, {
          type: "SET_ROLE",
          payload: "manager"
        });

        assert(
          managerState.meta.activeRole === "manager" &&
            managerState.meta.activeUserId ===
              ROLE_USERS.manager &&
            managerState.ui.activeView ===
              ROLE_DEFAULT_VIEW.manager,
          "Role switching updates role, user and default view"
        );

        const maxStepState = reducer(seed, {
          type: "SET_MATCH_STEP",
          payload: 99
        });

        const minStepState = reducer(seed, {
          type: "SET_MATCH_STEP",
          payload: -12
        });

        assert(
          maxStepState.ui.matchWizardStep === 3 &&
            minStepState.ui.matchWizardStep === 0,
          "Wizard step is clamped between zero and three"
        );

        const signatureBefore =
          buildPersistentSignaturePayload(seed);

        const transientState = {
          ...seed,
          ui: {
            ...seed.ui,
            activeDrawer: "test-drawer",
            activeModal: "test-modal",
            toastQueue: [
              {
                id: "toast-test",
                message: "Test",
                kind: "info"
              }
            ],
            matchWizardStep: 3
          }
        };

        const signatureAfter =
          buildPersistentSignaturePayload(transientState);

        assert(
          JSON.stringify(signatureBefore) ===
            JSON.stringify(signatureAfter),
          "Transient UI changes do not alter persistent signature"
        );

        const buyerState = reducer(seed, {
          type: "SET_ROLE",
          payload: "buyer"
        });

        assert(
          JSON.stringify(
            buildPersistentSignaturePayload(seed)
          ) !==
            JSON.stringify(
              buildPersistentSignaturePayload(buyerState)
            ),
          "Stable role and persona changes alter persistent signature"
        );

        const fixedTimestamp =
          "2026-07-28T12:00:00.000Z";

        const payload = buildPersistentPayload(
          seed,
          fixedTimestamp
        );

        assert(
          payload.meta.lastSavedAt === fixedTimestamp &&
            payload.ui === undefined &&
            payload.matchDraft === undefined,
          "Persistent payload contains timestamp and excludes transient state"
        );

        const currentMigration = migrateSavedState(
          buildPersistentPayload(seed, fixedTimestamp)
        );

        assert(
          currentMigration.ok &&
            currentMigration.state.meta.schemaVersion ===
              SCHEMA_VERSION,
          "Current schema migrates without data loss"
        );

        const legacyMigration = migrateSavedState({
          meta: {
            schemaVersion: 0,
            activeRole: "buyer"
          },
          plants: seed.plants
        });

        assert(
          legacyMigration.ok &&
            legacyMigration.migratedFrom === 0 &&
            Array.isArray(
              legacyMigration.state.actionItems
            ),
          "Compatible legacy schema receives missing collections"
        );

        let futureSchemaRejected = false;

        try {
          migrateSavedState({
            meta: {
              schemaVersion: SCHEMA_VERSION + 10
            }
          });
        } catch (error) {
          futureSchemaRejected = true;
        }

        assert(
          futureSchemaRejected,
          "Unsupported future schema is rejected"
        );

        for (const [label, malformed] of [
          ["null", null],
          ["array", []],
          ["string", "bad"],
          ["number", 42]
        ]) {
          const migration = migrateSavedState(malformed);

          assert(
            !migration.ok &&
              typeof migration.notice === "string",
            `Malformed ${label} state fails safely`
          );
        }

        const corruptCurrent = buildPersistentPayload(
          seed,
          fixedTimestamp
        );

        corruptCurrent.plants = "not-an-array";

        const corruptHydration =
          hydratePersistentState(corruptCurrent);

        assert(
          corruptHydration.notice &&
            corruptHydration.state.plants.length ===
              DEMO_STATE.plants.length,
          "Corrupt critical collection restores complete seed catalogue"
        );

        const hydrated = hydratePersistentState(
          buildPersistentPayload(seed, fixedTimestamp)
        );

        assert(
          hydrated.state.ui.activeDrawer === null &&
            hydrated.state.ui.activeModal === null &&
            hydrated.state.ui.toastQueue.length === 0 &&
            hydrated.state.ui.matchWizardStep === 0,
          "Hydration resets all transient interface state"
        );

        let validPayloadBuilt = false;

        try {
          buildPersistentPayload(seed, fixedTimestamp);
          validPayloadBuilt = true;
        } catch (error) {
          validPayloadBuilt = false;
        }

        assert(
          validPayloadBuilt,
          "Persistent payload builds successfully for valid state"
        );

        const memoryStorage = createMemoryStorage();
        const memorySavedAt = writePersistentPayload(
          memoryStorage,
          TEST_STORAGE_KEY,
          payload
        );

        assert(
          memorySavedAt === fixedTimestamp &&
            memoryStorage.getItem(TEST_STORAGE_KEY) !== null,
          "Storage adapter writes only to supplied test storage"
        );

        const restoredFromMemory = loadStateFromStorage(
          memoryStorage,
          TEST_STORAGE_KEY
        );

        assert(
          restoredFromMemory.state &&
            restoredFromMemory.state.plants.length ===
              seed.plants.length,
          "Storage adapter restores a valid persisted state"
        );

        const malformedStorage = createMemoryStorage({
          [TEST_STORAGE_KEY]: "{bad-json"
        });

        const malformedRestore = loadStateFromStorage(
          malformedStorage,
          TEST_STORAGE_KEY,
          { warn() {} }
        );

        assert(
          malformedRestore.notice &&
            malformedRestore.state.plants.length ===
              seed.plants.length,
          "Malformed stored JSON returns seed state with notice"
        );

        const scheduled = new Map();
        let nextTimerId = 1;

        const fakeSetTimeout = (callback, delay) => {
          const timerId = nextTimerId++;
          scheduled.set(timerId, {
            callback: () => {
              scheduled.delete(timerId);
              callback();
            },
            delay
          });
          return timerId;
        };

        const fakeClearTimeout = (timerId) => {
          scheduled.delete(timerId);
        };

        const timerService = new ToastTimerService(
          fakeSetTimeout,
          fakeClearTimeout
        );

        let dismissedToastId = null;

        timerService.setOnDismiss((id) => {
          dismissedToastId = id;
        });

        timerService.add("toast-a");

        assert(
          timerService.hasTimer("toast-a") &&
            scheduled.size === 1,
          "Toast service schedules a timer"
        );

        timerService.pause("toast-a");

        assert(
          timerService.isPaused("toast-a") &&
            !timerService.hasTimer("toast-a") &&
            scheduled.size === 0,
          "Toast service pauses and clears its timer"
        );

        timerService.sync(["toast-a"]);

        assert(
          timerService.isPaused("toast-a") &&
            !timerService.hasTimer("toast-a"),
          "Unrelated synchronisation does not restart a paused toast"
        );

        timerService.resume("toast-a");

        assert(
          !timerService.isPaused("toast-a") &&
            timerService.hasTimer("toast-a") &&
            scheduled.size === 1,
          "Toast service resumes with a fresh timer"
        );

        const activeTimerId =
          timerService.timers.get("toast-a");

        scheduled.get(activeTimerId).callback();

        assert(
          dismissedToastId === "toast-a" &&
            !timerService.hasTimer("toast-a"),
          "Toast timer callback dismisses and removes bookkeeping"
        );

        timerService.add("toast-b");
        timerService.add("toast-c");
        timerService.destroy();

        assert(
          timerService.timers.size === 0 &&
            timerService.paused.size === 0 &&
            scheduled.size === 0,
          "Toast service destroys every timer"
        );

        const resetState = reducer(
          {
            ...seed,
            plants: [],
            ui: {
              ...seed.ui,
              activeDrawer: "open",
              toastQueue: [
                {
                  id: "toast-reset",
                  message: "Reset",
                  kind: "info"
                }
              ]
            }
          },
          {
            type: "RESET_DEMO"
          }
        );

        assert(
          resetState.plants.length ===
            DEMO_STATE.plants.length &&
            resetState.ui.activeDrawer === null &&
            resetState.ui.toastQueue.length === 0,
          "Reset restores exact seed domain and transient state"
        );

        const unknownState = reducer(seed, {
          type: "NOT_A_TIMBER_ACTION"
        });

        assert(
          unknownState === seed,
          "Unknown reducer action preserves object identity"
        );

        /* ---------- Phase 2: catalogue invariants ---------- */
        const LIGHT_WORDS = ["sun", "shade", "shady", "bright", "dark", "partial", "full"];

        assert(
          DEMO_PLANTS.every(
            (plant) =>
              plant.siteRequirements.sunMin <= plant.siteRequirements.sunNeed
          ),
          "Every catalogue record keeps sunMin at or below sunNeed"
        );

        assert(
          DEMO_PLANTS.every((plant) =>
            [plant.siteRequirements.sunNeed, plant.siteRequirements.sunMin].every(
              (value) => Number.isInteger(value) && value >= 0 && value <= 100
            )
          ),
          "sunNeed and sunMin are integers within 0-100"
        );

        assert(
          DEMO_PLANTS.every((plant) =>
            [
              plant.suitability.maintenance,
              plant.suitability.droughtTolerance,
              plant.suitability.resilience,
              plant.care.water
            ].every((value) => Number.isInteger(value) && value >= 0 && value <= 20)
          ),
          "Timber ratings are integers within 0-20"
        );

        assert(
          DEMO_PLANTS.every((plant) =>
            plant.siteRequirements.aspects.every(
              (aspect) =>
                ASPECTS.includes(aspect) &&
                !LIGHT_WORDS.some((word) => aspect.toLowerCase().includes(word))
            )
          ),
          "Aspect holds compass facings only, never light terminology"
        );

        assert(
          DEMO_PLANTS.every((plant) => {
            const soilWords = plant.siteRequirements.soils.map((soil) => soil.toLowerCase());
            const warning = plant.care.soilWarning.toLowerCase();
            return !soilWords.some((word) => warning.includes(word));
          }),
          "soilWarning adds a constraint rather than repeating the soil type"
        );

        assert(
          DEMO_PLANTS.every(
            (plant) =>
              FOLIAGE_VALUES.includes(plant.appearance.foliage) &&
              CONTAINER_VALUES.includes(plant.suitability.container) &&
              COMPLIANCE_STATUSES.includes(plant.safety.compliance.status) &&
              ["humans", "cats", "dogs"].every((key) =>
                TOXICITY_VALUES.includes(plant.safety.toxicity[key])
              )
          ),
          "Foliage, container, compliance and toxicity use controlled values only"
        );

        assert(
          DEMO_PLANTS.every((plant) => {
            const peak = plant.appearance.peakInterest;
            return (
              Number.isInteger(peak.startMonth) &&
              Number.isInteger(peak.endMonth) &&
              peak.startMonth >= 1 && peak.startMonth <= 12 &&
              peak.endMonth >= 1 && peak.endMonth <= 12
            );
          }),
          "Peak interest parses to real month numbers"
        );

        assert(
          new Set(DEMO_PLANTS.map((plant) => plant.id)).size === DEMO_PLANTS.length &&
            new Set(DEMO_PLANTS.map((plant) => plant.slug)).size === DEMO_PLANTS.length,
          "Catalogue ids and slugs are unique"
        );

        /* ---------- Phase 2: scoring engine ---------- */
        const CONTEXT = { siteId: "site-oxted-demo" };
        const baseRequirements = () => cloneJson(DEMO_STATE.matchDraft);

        assert(
          Object.values(MATCH_WEIGHTS).reduce((sum, weight) => sum + weight, 0) === 100,
          "Default criterion weights total exactly 100"
        );

        assert(
          monthInRange(1, 11, 4) && monthInRange(12, 11, 4) && !monthInRange(6, 11, 4),
          "Peak interest ranges that wrap the year are read correctly"
        );

        const catSafeReq = baseRequirements();
        catSafeReq.safety.cats = "required";

        const yew = DEMO_PLANTS.find((plant) => plant.id === "plant-taxus-baccata");
        const yewResult = scorePlant(yew, catSafeReq, CONTEXT);

        assert(
          yewResult.blockers.some((blocker) => blocker.criterion === "safety") &&
            yewResult.eligible === false,
          "A strict cat-safe requirement blocks a plant known to be toxic to cats"
        );

        const pittosporum = DEMO_PLANTS.find(
          (plant) => plant.id === "plant-pittosporum-elizabeth"
        );

        const pittosporumResult = scorePlant(pittosporum, catSafeReq, CONTEXT);

        assert(
          pittosporumResult.blockers.length === 0 &&
            pittosporumResult.unknowns.some((entry) => entry.criterion === "safety"),
          "Unverified toxicity becomes an unknown rather than a pass or a block"
        );

        const catSafeRun = runMatch(DEMO_PLANTS, catSafeReq, CONTEXT);

        assert(
          catSafeRun.verification.some((entry) => entry.plantId === "plant-pittosporum-elizabeth") &&
            !catSafeRun.eligible.some((entry) => entry.plantId === "plant-pittosporum-elizabeth"),
          "Unverified safety data holds a plant out of the saleable ranking"
        );

        assert(
          !catSafeRun.eligible.some((entry) => entry.plantId === "plant-taxus-baccata") &&
            catSafeRun.unavailable.some(
              (entry) =>
                entry.plantId === "plant-taxus-baccata" &&
                ["blocked", "out-of-stock"].includes(entry.unavailableReason)
            ),
          "Blocked plants never appear in the primary recommendations"
        );

        const openRun = runMatch(DEMO_PLANTS, baseRequirements(), CONTEXT);

        assert(
          openRun.unavailable.some(
            (entry) =>
              entry.plantId === "plant-olea-europaea" &&
              entry.unavailableReason === "compliance-hold"
          ) && !openRun.eligible.some((entry) => entry.plantId === "plant-olea-europaea"),
          "A compliance hold removes a plant from sale regardless of its score"
        );

        assert(
          openRun.unavailable.some(
            (entry) =>
              entry.plantId === "plant-nymphaea-marliacea-carnea" &&
              entry.unavailableReason === "out-of-stock"
          ) &&
            !openRun.eligible.some(
              (entry) => entry.plantId === "plant-nymphaea-marliacea-carnea"
            ),
          "Out-of-stock plants are a demand opportunity, not a recommendation"
        );

        assert(
          openRun.eligible.every(
            (entry) => stockAtSite(
              DEMO_PLANTS.find((plant) => plant.id === entry.plantId),
              CONTEXT.siteId
            ) > 0
          ),
          "Every primary recommendation is saleable at the active site"
        );

        const evergreenReq = baseRequirements();
        evergreenReq.evergreen.value = true;
        evergreenReq.evergreen.strictness = "required";

        const maple = DEMO_PLANTS.find((plant) => plant.id === "plant-acer-bloodgood");
        const mapleResult = scorePlant(maple, evergreenReq, CONTEXT);

        assert(
          mapleResult.blockers.some((blocker) => blocker.criterion === "evergreen"),
          "A required criterion that scores zero produces a blocker"
        );

        const preferredEvergreenReq = baseRequirements();
        preferredEvergreenReq.evergreen.value = true;
        preferredEvergreenReq.evergreen.strictness = "preferred";

        const maplePreferred = scorePlant(maple, preferredEvergreenReq, CONTEXT);

        assert(
          maplePreferred.blockers.length === 0 &&
            maplePreferred.compromises.some((entry) => entry.criterion === "evergreen"),
          "The same criterion set to preferred deducts points instead of blocking"
        );

        const richReq = baseRequirements();
        richReq.light.preferred = 45;
        richReq.light.minimum = 30;
        richReq.soil.value = "loam";
        richReq.moisture.value = "moist-well-drained";
        richReq.height.maximumM = 2.5;
        richReq.spread.maximumM = 2;
        richReq.evergreen.value = true;
        richReq.budget.amountGBP = 45;
        richReq.safety.cats = "required";

        const richRun = runMatch(DEMO_PLANTS, richReq, CONTEXT);
        const allRich = richRun.eligible.concat(richRun.verification, richRun.unavailable);

        assert(
          allRich.every(
            (entry) => entry.score >= 0 && entry.score <= 100 && Number.isInteger(entry.score)
          ),
          "Every score is a whole number between 0 and 100"
        );

        assert(
          allRich.every(
            (entry) =>
              !(
                entry.score === 100 &&
                (DEMO_PLANTS.find((plant) => plant.id === entry.plantId).intelligence
                  .uncertainty.length > 0 ||
                  DEMO_PLANTS.find((plant) => plant.id === entry.plantId).intelligence
                    .confidence < 90)
              )
          ),
          "No plant reaches a perfect score while research uncertainty remains"
        );

        const repeatRun = runMatch(DEMO_PLANTS, richReq, CONTEXT);

        assert(
          JSON.stringify(richRun.eligible.map((entry) => [entry.plantId, entry.score])) ===
            JSON.stringify(repeatRun.eligible.map((entry) => [entry.plantId, entry.score])),
          "Identical input produces an identical ranking"
        );

        const shuffled = DEMO_PLANTS.slice().reverse();
        const shuffledRun = runMatch(shuffled, richReq, CONTEXT);

        assert(
          JSON.stringify(richRun.eligible.map((entry) => entry.plantId)) ===
            JSON.stringify(shuffledRun.eligible.map((entry) => entry.plantId)),
          "Ranking does not depend on catalogue order"
        );

        assert(
          richRun.eligible.every(
            (entry, index) =>
              index === 0 || richRun.eligible[index - 1].score >= entry.score
          ),
          "Recommendations are returned in descending score order"
        );

        const budgetReq = baseRequirements();
        budgetReq.budget.amountGBP = 40;

        // Citrus 'Meyer' is £44.99 against a £40 preferred budget — the
        // "strong match, £5 over" case from acceptance scenario 3.
        const overBudget = scorePlant(
          DEMO_PLANTS.find((plant) => plant.id === "plant-citrus-meyer"),
          budgetReq,
          CONTEXT
        );

        assert(
          overBudget.blockers.length === 0 &&
            overBudget.compromises.some(
              (entry) => entry.criterion === "budget" && /over the preferred budget/.test(entry.label)
            ),
          "A plant slightly over a preferred budget stays visible with a stated deduction"
        );

        /* ---------- Phase 2: state transitions ---------- */
        const runState = reducer(
          { ...cloneSeed(), matchDraft: richReq },
          { type: "MATCH_RUN", payload: { ranAt: fixedTimestamp } }
        );

        assert(
          runState.matchRun !== null &&
            runState.matchRun.ranAt === fixedTimestamp &&
            runState.ui.matchWizardStep === 3,
          "Running a match stores the requirement snapshot and moves to the results step"
        );

        const shortlisted = reducer(runState, {
          type: "MATCH_ADD_TO_SHORTLIST",
          payload: { plantId: "plant-hebe-rakaiensis", quantity: 3 }
        });

        const shortlistedTwice = reducer(shortlisted, {
          type: "MATCH_ADD_TO_SHORTLIST",
          payload: { plantId: "plant-hebe-rakaiensis", quantity: 3 }
        });

        assert(
          shortlisted.matchShortlist.length === 1 &&
            shortlistedTwice.matchShortlist.length === 1,
          "A plant cannot be added to the shortlist twice"
        );

        const demandBefore = runState.demandSignals.length;

        const rejected = reducer(shortlisted, {
          type: "MATCH_RECORD_REJECTION",
          payload: {
            plantId: "plant-hebe-rakaiensis",
            reasonId: "too-expensive",
            note: "",
            seenAt: fixedTimestamp
          }
        });

        const rejectedPlant = rejected.plants.find(
          (plant) => plant.id === "plant-hebe-rakaiensis"
        );

        assert(
          rejected.demandSignals.length === demandBefore + 1 &&
            rejected.demandSignals[rejected.demandSignals.length - 1].reasonCounts[
              "too-expensive"
            ] === 1,
          "Declining a recommendation writes a demand signal with the reason"
        );

        assert(
          rejectedPlant.analytics.rejected30d === 1 &&
            rejected.matchShortlist.length === 0,
          "Declining updates plant analytics and clears the plant from the shortlist"
        );

        assert(
          rejectionReasonTotals(rejected).some(
            (entry) => entry.reasonId === "too-expensive" && entry.count > 0
          ),
          "Decline reasons aggregate into the buyer's view"
        );

        const saved = reducer(shortlisted, {
          type: "MATCH_SAVE_SESSION",
          payload: {
            id: "match-test-1",
            createdAt: fixedTimestamp,
            rankedPlantIds: ["plant-hebe-rakaiensis"],
            estimatedBasketGBP: 38.97
          }
        });

        const savedSession = saved.matchSessions[saved.matchSessions.length - 1];

        assert(
          savedSession.status === "shortlist-created" &&
            savedSession.shortlistedPlantIds.length === 1 &&
            !("acceptedPlantIds" in savedSession) &&
            !("sold" in savedSession) &&
            !("purchased" in savedSession),
          "A saved session records a shortlist and never claims a sale"
        );

        assert(
          savedSession.followUp.requested === false &&
            !deriveActionItems(saved).some(
              (item) => item.id === `match-follow-up:${savedSession.id}`
            ),
          "No follow-up action is created unless the customer asked for one"
        );

        const followUpState = reducer(
          reducer(shortlisted, { type: "MATCH_SET_FOLLOW_UP", payload: true }),
          {
            type: "MATCH_SAVE_SESSION",
            payload: {
              id: "match-test-2",
              createdAt: fixedTimestamp,
              rankedPlantIds: ["plant-hebe-rakaiensis"],
              estimatedBasketGBP: 38.97
            }
          }
        );

        assert(
          deriveActionItems(followUpState).some(
            (item) => item.id === "match-follow-up:match-test-2"
          ),
          "A requested follow-up appears in the Today queue"
        );

        const emptyRunState = reducer(
          { ...cloneSeed(), matchDraft: richReq },
          { type: "MATCH_RUN", payload: { ranAt: fixedTimestamp } }
        );

        const unmatchedSave = reducer(emptyRunState, {
          type: "MATCH_SAVE_SESSION",
          payload: {
            id: "match-test-3",
            createdAt: fixedTimestamp,
            rankedPlantIds: [],
            estimatedBasketGBP: 0
          }
        });

        const unmatchedSignal = unmatchedSave.demandSignals.find(
          (signal) => signal.label === emptyRunState.matchRun.summary
        );

        assert(
          Boolean(unmatchedSignal) && unmatchedSignal.matched === false,
          "A search that ranked nothing is recorded as unmet demand"
        );

        assert(
          deriveActionItems(unmatchedSave).some(
            (item) => item.type === "no-stock-demand" && item.entityId === unmatchedSignal.id
          ),
          "Unmet demand reaches the buyer's Today queue"
        );

        /* ---------- Phase 2: Today queue ---------- */
        const derivedSeed = deriveActionItems(seed);

        assert(
          derivedSeed.length > 0 &&
            derivedSeed.some((item) => item.type === "compliance-warning") &&
            derivedSeed.some((item) => item.type === "missing-photograph") &&
            derivedSeed.some((item) => item.type === "missing-toxicity"),
          "The Today queue is derived from the catalogue rather than hand-listed"
        );

        const targetAction = derivedSeed.find((item) => item.type === "missing-photograph");

        const resolvedState = reducer(seed, {
          type: "ACTION_RESOLVE",
          payload: { id: targetAction.id }
        });

        const afterResolve = deriveActionItems(resolvedState).find(
          (item) => item.id === targetAction.id
        );

        assert(
          afterResolve.status === "resolved",
          "Resolving an action changes its state in the derived queue"
        );

        const reopened = reducer(resolvedState, {
          type: "ACTION_REOPEN",
          payload: { id: targetAction.id }
        });

        assert(
          deriveActionItems(reopened).find((item) => item.id === targetAction.id).status ===
            "pending",
          "Reopening an action returns it to the queue"
        );

        const assignedState = reducer(seed, {
          type: "ACTION_ASSIGN",
          payload: { id: targetAction.id, ownerId: "staff-bob" }
        });

        assert(
          deriveActionItems(assignedState).find((item) => item.id === targetAction.id)
            .ownerId === "staff-bob",
          "Assigning an action records its owner"
        );

        const floorOrder = sortActionItemsForRole(derivedSeed, "floor");
        const buyerOrder = sortActionItemsForRole(derivedSeed, "buyer");

        assert(
          floorOrder[0].roles.includes("floor") &&
            buyerOrder[0].roles.includes("buyer") &&
            floorOrder[0].id !== buyerOrder[0].id,
          "Each role sees a different top priority"
        );

        const matchResetState = reducer(shortlisted, { type: "MATCH_RESET" });

        assert(
          matchResetState.matchRun === null &&
            matchResetState.matchShortlist.length === 0 &&
            matchResetState.ui.matchWizardStep === 0 &&
            JSON.stringify(matchResetState.matchDraft) ===
              JSON.stringify(DEMO_STATE.matchDraft),
          "Starting again clears the run, the shortlist and the requirements"
        );
      } finally {
        window.localStorage.removeItem(TEST_STORAGE_KEY);
      }

      const productionAfter =
        window.localStorage.getItem(STORAGE_KEY);

      assert(
        productionAfter === productionBefore,
        "Self-tests preserve the production storage key exactly"
      );

      const total = results.length;
      const failed = total - passed;
      const summary = `Self-tests: ${passed} / ${total} passed`;

      console.log(summary);
      results.forEach((result) => console.log(result));

      return {
        passed,
        failed,
        total,
        results,
        summary
      };
    };

    // ============================================================
    // 13. RENDER
    // ============================================================
    const root = ReactDOM.createRoot(
      document.getElementById("root")
    );

    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
